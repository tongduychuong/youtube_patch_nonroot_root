name: Check Morphe Max Supported YouTube Version

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ==========================================================
      # MAIN - STABLE YOUTUBE
      # Source:
      # https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-list.json
      #
      # Output:
      # version.txt
      # ==========================================================
      - name: Check Stable YouTube Version - Main
        shell: bash
        run: |
          python3 <<'PY' > main_output.txt
          import json
          import os
          import re
          import sys
          import urllib.request

          URL = (
              "https://raw.githubusercontent.com/"
              "MorpheApp/morphe-patches/main/patches-list.json"
          )

          print(
              f"Checking Main: {URL}",
              file=sys.stderr
          )

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          versions = set()

          def version_key(version):
              return tuple(
                  int(x)
                  for x in version.split(".")
              )

          # Morphe structure:
          #
          # patches[]
          #   └── compatiblePackages[]
          #         ├── packageName
          #         └── targets[]
          #               ├── version
          #               └── isExperimental
          #
          for patch in (data.get("patches") or []):

              if not isinstance(patch, dict):
                  continue

              for package in (
                  patch.get("compatiblePackages") or []
              ):

                  if not isinstance(package, dict):
                      continue

                  package_name = str(
                      package.get("packageName") or ""
                  ).lower()

                  if package_name != (
                      "com.google.android.youtube"
                  ):
                      continue

                  for target in (
                      package.get("targets") or []
                  ):

                      if not isinstance(target, dict):
                          continue

                      version = str(
                          target.get("version") or ""
                      ).strip()

                      is_experimental = bool(
                          target.get(
                              "isExperimental",
                              False
                          )
                      )

                      if (
                          version
                          and not is_experimental
                          and re.fullmatch(
                              r"\d+\.\d+\.\d+",
                              version
                          )
                      ):
                          versions.add(version)

          if not versions:
              raise RuntimeError(
                  "Không tìm thấy stable YouTube version "
                  "trong Morphe main/patches-list.json"
              )

          stable_version = max(
              versions,
              key=version_key
          )

          current_version = ""

          if os.path.exists("version.txt"):
              with open(
                  "version.txt",
                  "r",
                  encoding="utf-8"
              ) as file:
                  current_version = file.read().strip()

          # ALWAYS synchronize version.txt.
          # Downgrade is intentional.
          if current_version != stable_version:

              with open(
                  "version.txt",
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(
                      stable_version + "\n"
                  )

              changed = "true"
              status = "Updated"

          else:
              changed = "false"
              status = "Skip"

          print(
              f"VERSION_CHANGED_MAIN={changed}"
          )
          print(
              f"NEW_VERSION_MAIN={stable_version}"
          )
          print(
              f"CURRENT_VERSION_MAIN={current_version}"
          )
          print(
              f"STATUS_MAIN={status}"
          )
          PY

          cat main_output.txt

      # ==========================================================
      # DEV - YOUTUBE
      # Source:
      # https://raw.githubusercontent.com/MorpheApp/morphe-patches/dev/README.md
      #
      # Output:
      # version_dev.txt
      # ==========================================================
      - name: Check Dev YouTube Version - Dev README
        shell: bash
        run: |
          python3 <<'PY' > dev_output.txt
          import os
          import re
          import sys
          import urllib.request

          URL = (
              "https://raw.githubusercontent.com/"
              "MorpheApp/morphe-patches/dev/README.md"
          )

          print(
              f"Checking Dev: {URL}",
              file=sys.stderr
          )

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "GitHub-Actions"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              readme = response.read().decode(
                  "utf-8"
              )

          # ------------------------------------------------------
          # Find YouTube section
          # ------------------------------------------------------

          youtube_match = re.search(
              r"(?is)"
              r"(?:^|\n)#+\s*YouTube\b"
              r"(.*?)(?=\n#+\s|\Z)",
              readme
          )

          if youtube_match:
              youtube_block = (
                  youtube_match.group(1)
              )
          else:
              youtube_block = readme

          # ------------------------------------------------------
          # Extract versions
          # ------------------------------------------------------

          versions = set(
              re.findall(
                  r"\b\d{1,3}\.\d{1,3}\.\d{1,3}\b",
                  youtube_block
              )
          )

          # Ignore date-like values.
          versions = [
              version
              for version in versions
              if not version.startswith(
                  (
                      "2024.",
                      "2025.",
                      "2026."
                  )
              )
          ]

          if not versions:
              raise RuntimeError(
                  "Không tìm thấy YouTube version "
                  "trong Morphe dev/README.md"
              )

          def version_key(version):
              return tuple(
                  int(x)
                  for x in version.split(".")
              )

          dev_version = max(
              versions,
              key=version_key
          )

          current_dev_version = ""

          if os.path.exists(
              "version_dev.txt"
          ):
              with open(
                  "version_dev.txt",
                  "r",
                  encoding="utf-8"
              ) as file:
                  current_dev_version = (
                      file.read().strip()
                  )

          if current_dev_version != dev_version:

              with open(
                  "version_dev.txt",
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(
                      dev_version + "\n"
                  )

              changed = "true"
              status = "Updated"

          else:
              changed = "false"
              status = "Skip"

          print(
              f"VERSION_CHANGED_DEV={changed}"
          )
          print(
              f"NEW_VERSION_DEV={dev_version}"
          )
          print(
              f"CURRENT_VERSION_DEV={current_dev_version}"
          )
          print(
              f"STATUS_DEV={status}"
          )
          PY

          cat dev_output.txt

      # ==========================================================
      # COMMIT + PUSH
      # ==========================================================
      - name: Commit and Push if Updated
        shell: bash
        run: |
          source main_output.txt
          source dev_output.txt

          MAIN_STATUS="Skip"
          DEV_STATUS="Skip"

          if [ "$VERSION_CHANGED_MAIN" = "true" ]; then
            MAIN_STATUS="$NEW_VERSION_MAIN"
          fi

          if [ "$VERSION_CHANGED_DEV" = "true" ]; then
            DEV_STATUS="$NEW_VERSION_DEV"
          fi

          if [ "$VERSION_CHANGED_MAIN" = "true" ] || \
             [ "$VERSION_CHANGED_DEV" = "true" ]; then

            git config --global user.name \
              "github-actions[bot]"

            git config --global user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              version.txt \
              version_dev.txt

            git commit -m \
              "build: update YouTube versions (main: $MAIN_STATUS, dev: $DEV_STATUS)"

            git push

            echo "======================================"
            echo "YouTube versions updated"
            echo "Main: $MAIN_STATUS"
            echo "Dev : $DEV_STATUS"
            echo "======================================"

          else

            echo "======================================"
            echo "No version changes"
            echo "Main: Skip"
            echo "Dev : Skip"
            echo "======================================"

          fi

      # ==========================================================
      # GITHUB ACTIONS SUMMARY
      # ==========================================================
      - name: GitHub Actions Summary
        shell: bash
        run: |
          source main_output.txt
          source dev_output.txt

          {
            echo "## Morphe YouTube Versions"
            echo
            echo "| Channel | Source | Current | Detected | Status |"
            echo "|---|---|---|---|---|"
            echo "| Main Stable | main/patches-list.json | \`$CURRENT_VERSION_MAIN\` | \`$NEW_VERSION_MAIN\` | $STATUS_MAIN |"
            echo "| Dev | dev/README.md | \`$CURRENT_VERSION_DEV\` | \`$NEW_VERSION_DEV\` | $STATUS_DEV |"
            echo
            echo "### Commit"
            echo
            echo "- Main: \`$([ "$VERSION_CHANGED_MAIN" = "true" ] && echo "$NEW_VERSION_MAIN" || echo "Skip")\`"
            echo "- Dev: \`$([ "$VERSION_CHANGED_DEV" = "true" ] && echo "$NEW_VERSION_DEV" || echo "Skip")\`"
          } >> "$GITHUB_STEP_SUMMARY"
