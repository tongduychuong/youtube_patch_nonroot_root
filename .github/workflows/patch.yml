name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:

  main:
    name: Stable
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y p7zip-full zipalign apksigner

      - name: Read version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Stable: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube APK
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "YouTube APK: $INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # -------------------------------------------------
      # NON ROOT
      # GmsCore support ENABLED
      # Custom branding DISABLED
      # -------------------------------------------------

      - name: Patch Stable Non Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-${VERSION}.apk"

      # -------------------------------------------------
      # ROOT
      # GmsCore support DISABLED
      # Custom branding DISABLED
      # -------------------------------------------------

      - name: Patch Stable Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-root-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-root-${VERSION}.apk"

      # -------------------------------------------------
      # CREATE ROOT MAGISK ZIP
      # Based on build_module(2).sh
      # -------------------------------------------------

      - name: Create Stable Magisk Root
        shell: bash
        run: |
          set -e

          MODULE_ID="youtube-morphe-root"
          MODULE_NAME="YouTube Morphe Root"
          ZIP_OUT="youtube-morphe-root-${VERSION}.zip"

          rm -rf BASE_TEMPLATE

          mkdir -p \
            BASE_TEMPLATE/META-INF/com/google/android \
            BASE_TEMPLATE/stock

          # Patched APK
          cp -f \
            youtube-root-${VERSION}.apk \
            BASE_TEMPLATE/base.apk

          # Stock APK
          cp -f \
            "$INPUT" \
            BASE_TEMPLATE/stock/base.apk

          # module.prop
          cat > BASE_TEMPLATE/module.prop <<EOF
          id=${MODULE_ID}
          name=${MODULE_NAME}
          version=${VERSION}
          versionCode=$(date +%Y%m%d)
          author=Chuong
          description=${MODULE_NAME} with Stock APK and patched APK
          EOF

          # customize.sh
          cat > BASE_TEMPLATE/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Root"
          ui_print "======================================"

          ui_print "- Stock APK included"
          ui_print "- Patched APK included"
          ui_print "- GmsCore support: Disabled"
          ui_print "- Custom branding: Disabled"

          PKG_NAME="com.google.android.youtube"

          TARGET_APK="$(pm path "$PKG_NAME" 2>/dev/null | head -n 1 | cut -d':' -f2)"

          if [ -z "$TARGET_APK" ]; then

              if [ -f "$MODPATH/stock/base.apk" ]; then

                  ui_print "- YouTube not installed"
                  ui_print "- Installing stock YouTube..."

                  pm install -r \
                    "$MODPATH/stock/base.apk" \
                    >/dev/null 2>&1 || true

              fi

          else

              ui_print "- Stock YouTube found:"
              ui_print "  $TARGET_APK"

          fi

          set_perm_recursive \
            "$MODPATH" \
            0 \
            0 \
            0755 \
            0644

          chmod 0755 "$MODPATH/customize.sh"
          chmod 0755 "$MODPATH/service.sh"

          ui_print "======================================"
          EOF

          # service.sh
          cat > BASE_TEMPLATE/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          PKG_NAME="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe_root.log"

          exec >>"$LOG" 2>&1

          echo "======================================"
          echo "YouTube Morphe Root"
          echo "======================================"

          while [ "$(getprop sys.boot_completed)" != "1" ]; do
              sleep 3
          done

          sleep 5

          TARGET_APK="$(
              pm path "$PKG_NAME" 2>/dev/null |
              head -n 1 |
              cut -d':' -f2
          )"

          if [ -z "$TARGET_APK" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          echo "Detected YouTube:"
          echo "$TARGET_APK"

          if [ ! -f "$MODDIR/base.apk" ]; then
              echo "ERROR: Patched APK missing"
              exit 1
          fi

          echo "Mounting patched APK..."

          mount -o bind \
              "$MODDIR/base.apk" \
              "$TARGET_APK"

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
              echo "ERROR: Mount failed"
              exit 1
          fi

          echo "Patched APK mounted."

          am force-stop \
              "$PKG_NAME" \
              >/dev/null 2>&1 || true

          echo "SUCCESS"

          EOF

          chmod +x BASE_TEMPLATE/customize.sh
          chmod +x BASE_TEMPLATE/service.sh

          # Magisk-style installer
          cat > BASE_TEMPLATE/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh

          UMASK=022

          ZIPFILE="$3"

          MODULE_ID="youtube-morphe-root"

          MODPATH="/data/adb/modules/${MODULE_ID}"

          mkdir -p "$MODPATH"

          unzip -o \
            "$ZIPFILE" \
            -x "META-INF/*" \
            -d "$MODPATH"

          chmod 0755 \
            "$MODPATH/customize.sh" \
            "$MODPATH/service.sh"

          chmod 0644 \
            "$MODPATH/module.prop" \
            "$MODPATH/base.apk" \
            "$MODPATH/stock/base.apk"
          EOF

          chmod +x \
            BASE_TEMPLATE/META-INF/com/google/android/update-binary

          # updater-script
          echo "# MAGISK INSTALLER" \
            > BASE_TEMPLATE/META-INF/com/google/android/updater-script

          # ------------------------------------------------
          # 7-ZIP
          # SAME METHOD AS build_module(2).sh
          # ------------------------------------------------

          cd BASE_TEMPLATE

          7z a \
            -tzip \
            -mx=9 \
            -mm=Deflate \
            -mfb=258 \
            "../${ZIP_OUT}" \
            ./*

          cd ..

          test -f "${ZIP_OUT}"

          echo "======================================"
          echo "STABLE ROOT ZIP"
          echo "======================================"

          ls -lh "${ZIP_OUT}"

          7z l "${ZIP_OUT}"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-root-${{ env.VERSION }}.zip
          retention-days: 1


  dev:

    name: Dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y p7zip-full zipalign apksigner

      - name: Read dev version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Dev: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube APK
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          test -n "$URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # -------------------------------------------------
      # DEV NON ROOT
      # -------------------------------------------------

      - name: Patch Dev Non Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-${VERSION}.apk"

      # -------------------------------------------------
      # DEV ROOT
      # -------------------------------------------------

      - name: Patch Dev Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-root-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-root-dev-${VERSION}.apk"

      # -------------------------------------------------
      # CREATE DEV ROOT
      # -------------------------------------------------

      - name: Create Dev Magisk Root
        shell: bash
        run: |
          set -e

          MODULE_ID="youtube-morphe-dev-root"
          MODULE_NAME="YouTube Morphe Dev Root"
          ZIP_OUT="youtube-morphe-dev-root-${VERSION}.zip"

          rm -rf BASE_TEMPLATE

          mkdir -p \
            BASE_TEMPLATE/META-INF/com/google/android \
            BASE_TEMPLATE/stock

          cp -f \
            youtube-root-dev-${VERSION}.apk \
            BASE_TEMPLATE/base.apk

          cp -f \
            "$INPUT" \
            BASE_TEMPLATE/stock/base.apk

          cat > BASE_TEMPLATE/module.prop <<EOF
          id=${MODULE_ID}
          name=${MODULE_NAME}
          version=${VERSION}
          versionCode=$(date +%Y%m%d)
          author=Chuong
          description=${MODULE_NAME} with Stock APK and patched APK
          EOF

          cat > BASE_TEMPLATE/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Dev Root"
          ui_print "======================================"

          ui_print "- Stock APK included"
          ui_print "- Patched APK included"
          ui_print "- GmsCore support: Disabled"
          ui_print "- Custom branding: Disabled"

          PKG_NAME="com.google.android.youtube"

          TARGET_APK="$(pm path "$PKG_NAME" 2>/dev/null | head -n 1 | cut -d':' -f2)"

          if [ -z "$TARGET_APK" ]; then

              if [ -f "$MODPATH/stock/base.apk" ]; then

                  ui_print "- Installing stock YouTube..."

                  pm install -r \
                    "$MODPATH/stock/base.apk" \
                    >/dev/null 2>&1 || true

              fi

          else

              ui_print "- Stock YouTube found:"
              ui_print "  $TARGET_APK"

          fi

          set_perm_recursive \
            "$MODPATH" \
            0 \
            0 \
            0755 \
            0644

          chmod 0755 "$MODPATH/customize.sh"
          chmod 0755 "$MODPATH/service.sh"

          ui_print "======================================"
          EOF

          cat > BASE_TEMPLATE/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          PKG_NAME="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe_dev_root.log"

          exec >>"$LOG" 2>&1

          echo "YouTube Morphe Dev Root"

          while [ "$(getprop sys.boot_completed)" != "1" ]; do
              sleep 3
          done

          sleep 5

          TARGET_APK="$(
              pm path "$PKG_NAME" 2>/dev/null |
              head -n 1 |
              cut -d':' -f2
          )"

          if [ -z "$TARGET_APK" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          echo "Target: $TARGET_APK"

          mount -o bind \
              "$MODDIR/base.apk" \
              "$TARGET_APK"

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
              echo "ERROR: Mount failed"
              exit 1
          fi

          am force-stop \
              "$PKG_NAME" \
              >/dev/null 2>&1 || true

          echo "SUCCESS"
          EOF

          chmod +x BASE_TEMPLATE/customize.sh
          chmod +x BASE_TEMPLATE/service.sh

          cat > BASE_TEMPLATE/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh

          UMASK=022

          ZIPFILE="$3"

          MODULE_ID="youtube-morphe-dev-root"

          MODPATH="/data/adb/modules/${MODULE_ID}"

          mkdir -p "$MODPATH"

          unzip -o \
            "$ZIPFILE" \
            -x "META-INF/*" \
            -d "$MODPATH"

          chmod 0755 \
            "$MODPATH/customize.sh" \
            "$MODPATH/service.sh"

          chmod 0644 \
            "$MODPATH/module.prop" \
            "$MODPATH/base.apk" \
            "$MODPATH/stock/base.apk"
          EOF

          chmod +x \
            BASE_TEMPLATE/META-INF/com/google/android/update-binary

          echo "# MAGISK INSTALLER" \
            > BASE_TEMPLATE/META-INF/com/google/android/updater-script

          cd BASE_TEMPLATE

          7z a \
            -tzip \
            -mx=9 \
            -mm=Deflate \
            -mfb=258 \
            "../${ZIP_OUT}" \
            ./*

          cd ..

          test -f "${ZIP_OUT}"

          echo "======================================"
          echo "DEV ROOT ZIP"
          echo "======================================"

          ls -lh "${ZIP_OUT}"

          7z l "${ZIP_OUT}"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-root-${{ env.VERSION }}.zip
          retention-days: 1


  release:

    name: Common Release

    needs:
      - main
      - dev

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Get Versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-*.apk" |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-dev-*.apk" |
            head -n 1
          )"

          test -n "$MAIN_APK"
          test -n "$DEV_APK"

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed 's/^youtube-morphe-//' |
            sed 's/\.apk$//'
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed 's/^youtube-morphe-dev-//' |
            sed 's/\.apk$//'
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release exists"

          else

            echo "Creating release"

            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                Non-root:
                - Custom branding disabled
                - GmsCore support enabled
                
                Root:
                - GmsCore support disabled
                - Custom branding disabled
                - Stock APK included
                - Patched APK included
                - META-INF included
                - 7-Zip Deflate compression"

          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}"

          gh release upload \
            "$TAG" \
            release/*.apk \
            release/*.zip \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
