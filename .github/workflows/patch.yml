name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  main:
    name: Morphe Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read version
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MAIN VERSION: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e
          test -f scripts/download_youtube.sh
          chmod +x scripts/download_youtube.sh
          ./scripts/download_youtube.sh "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(find . -maxdepth 2 -type f \( \
            -name "*.apk" -o \
            -name "*.apkm" -o \
            -name "*.xapk" -o \
            -name "*.apks" \
          \) | head -n 1)"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          echo "Selected: $INPUT"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" \
            "$API" \
            | grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' \
            | head -n 1)"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Stable
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-${VERSION}.apk"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: "youtube-morphe-${{ env.VERSION }}.apk"
          retention-days: 1


  dev:
    name: Morphe Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read dev version
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DEV VERSION: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e
          test -f scripts/download_youtube.sh
          chmod +x scripts/download_youtube.sh
          ./scripts/download_youtube.sh "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(find . -maxdepth 2 -type f \( \
            -name "*.apk" -o \
            -name "*.apkm" -o \
            -name "*.xapk" -o \
            -name "*.apks" \
          \) | head -n 1)"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          echo "Selected: $INPUT"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" \
            "$API" \
            | grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' \
            | head -n 1)"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Dev
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-${VERSION}.apk"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: "youtube-morphe-dev-${{ env.VERSION }}.apk"
          retention-days: 1


  release:
    name: Common Release
    needs:
      - main
      - dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Get versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(find release -maxdepth 1 \
            -name 'youtube-morphe-*.apk' \
            ! -name 'youtube-morphe-dev-*' \
            | head -n 1)"

          DEV_APK="$(find release -maxdepth 1 \
            -name 'youtube-morphe-dev-*.apk' \
            | head -n 1)"

          test -n "$MAIN_APK"
          test -n "$DEV_APK"

          MAIN_VERSION="$(basename "$MAIN_APK" \
            | sed 's/^youtube-morphe-//' \
            | sed 's/\.apk$//')"

          DEV_VERSION="$(basename "$DEV_APK" \
            | sed 's/^youtube-morphe-dev-//' \
            | sed 's/\.apk$//')"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

          Stable: ${MAIN_VERSION}
          Dev: ${DEV_VERSION}
          
          Custom branding: Disabled"
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
            --notes "YouTube Morphe

          Stable: ${MAIN_VERSION}
          Dev: ${DEV_VERSION}
          
          Custom branding: Disabled"

          gh release upload "$TAG" \
            release/*.apk \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
