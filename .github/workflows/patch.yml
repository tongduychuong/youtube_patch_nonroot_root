name: YouTube Morphe Patch

"on":
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Stable + Dev"
        required: false
        type: boolean
        default: true

  schedule:
    # 05:00 Vietnam time = 22:00 UTC
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  RELEASE_TAG: youtube-morphe
  MICROG_URL: https://github.com/MorpheApp/MicroG-RE/releases

jobs:

  # ==========================================================
  # STABLE
  # ==========================================================

  stable:
    name: Build Stable
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl \
            jq

      # ======================================================
      # YOUTUBE VERSION
      # ======================================================

      - name: Read stable YouTube version
        shell: bash
        run: |
          set -e

          test -f version.txt

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "YouTube Stable: $VERSION"

      # ======================================================
      # MORPHE STABLE
      # ======================================================

      - name: Get Morphe stable release
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          TAG="$(
            echo "$RESPONSE" |
            jq -r '.tag_name'
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Morphe stable release not found"
            exit 1
          fi

          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          echo "Morphe Stable: $TAG"

      # ======================================================
      # CHECK PATCH
      # MANUAL = FORCE BUILD
      # SCHEDULE = CHECK CHANGELOG
      # ======================================================

      - name: Check stable patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual run detected."
            echo "Force Stable build."

            echo "BUILD_STABLE=true" >> "$GITHUB_ENV"

            exit 0
          fi

          BUILD="true"

          if gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json 2>/dev/null; then

            jq -r '.body // ""' release.json > release_notes.txt

            if grep -Fq \
              "Morphe Patch ${MORPHE_VERSION} Changelog" \
              release_notes.txt; then

              echo "Morphe ${MORPHE_VERSION} already built."
              BUILD="false"

            else

              echo "New Morphe stable patch."
              echo "Build required."

            fi

          else

            echo "Release ${RELEASE_TAG} does not exist."
            echo "Build required."

          fi

          echo "BUILD_STABLE=$BUILD" >> "$GITHUB_ENV"

      # ======================================================
      # DOWNLOAD YOUTUBE
      # ======================================================

      - name: Download YouTube
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find YouTube APK
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "APK: $INPUT"

      # ======================================================
      # MORPHE CLI
      # ======================================================

      - name: Download Morphe CLI
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"
          )"

          URL="$(
            echo "$RESPONSE" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # ======================================================
      # BUILD NON ROOT
      # ======================================================

      - name: Build Stable Non Root
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      # ======================================================
      # BUILD ROOT
      # ======================================================

      - name: Build Stable Root
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      # ======================================================
      # KEYSTORE
      # ======================================================

      - name: Commit encrypted keystore
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          test -f keys/keystore.enc

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc unchanged"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Stable artifact
        if: env.BUILD_STABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  # ==========================================================
  # DEV
  # ==========================================================

  dev:
    name: Build Dev
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl \
            jq

      # ======================================================
      # YOUTUBE DEV VERSION
      # ======================================================

      - name: Read dev YouTube version
        shell: bash
        run: |
          set -e

          test -f version_dev.txt

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "YouTube Dev: $VERSION"

      # ======================================================
      # MORPHE DEV
      # ======================================================

      - name: Get Morphe dev release
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          TAG="$(
            echo "$RESPONSE" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | .tag_name
              ][0]
            '
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Morphe dev release not found"
            exit 1
          fi

          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          echo "Morphe Dev: $TAG"

      # ======================================================
      # CHECK PATCH
      # MANUAL = FORCE BUILD
      # SCHEDULE = CHECK CHANGELOG
      # ======================================================

      - name: Check dev patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual run detected."
            echo "Force Dev build."

            echo "BUILD_DEV=true" >> "$GITHUB_ENV"

            exit 0
          fi

          BUILD="true"

          if gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json 2>/dev/null; then

            jq -r '.body // ""' release.json > release_notes.txt

            if grep -Fq \
              "Morphe Patch ${MORPHE_VERSION} Changelog" \
              release_notes.txt; then

              echo "Morphe ${MORPHE_VERSION} already built."
              BUILD="false"

            else

              echo "New Morphe dev patch."
              echo "Build required."

            fi

          else

            echo "Release ${RELEASE_TAG} does not exist."
            echo "Build required."

          fi

          echo "BUILD_DEV=$BUILD" >> "$GITHUB_ENV"

      # ======================================================
      # DOWNLOAD YOUTUBE
      # ======================================================

      - name: Download YouTube
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find YouTube APK
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      # ======================================================
      # MORPHE CLI
      # ======================================================

      - name: Download Morphe CLI
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"
          )"

          URL="$(
            echo "$RESPONSE" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # ======================================================
      # BUILD NON ROOT
      # ======================================================

      - name: Build Dev Non Root
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      # ======================================================
      # BUILD ROOT
      # ======================================================

      - name: Build Dev Root
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      # ======================================================
      # KEYSTORE
      # ======================================================

      - name: Commit encrypted keystore
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          test -f keys/keystore.enc

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc unchanged"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Dev artifact
        if: env.BUILD_DEV == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube_dev_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  # ==========================================================
  # RELEASE
  # ==========================================================

  release:
    name: Create Release

    needs:
      - stable
      - dev

    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # DOWNLOAD ARTIFACTS
      # ======================================================

      - name: Download Stable
        if: needs.stable.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        if: needs.dev.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      # ======================================================
      # VERSIONS
      # ======================================================

      - name: Read YouTube versions
        shell: bash
        run: |
          set -e

          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      # ======================================================
      # GET MORPHE VERSIONS
      # ======================================================

      - name: Get current Morphe versions
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq

          MAIN_RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          MAIN_MORPHE="$(
            echo "$MAIN_RESPONSE" |
            jq -r '.tag_name'
          )"

          DEV_RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          DEV_MORPHE="$(
            echo "$DEV_RESPONSE" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | .tag_name
              ][0]
            '
          )"

          echo "MORPHE_MAIN_VERSION=$MAIN_MORPHE" >> "$GITHUB_ENV"
          echo "MORPHE_DEV_VERSION=$DEV_MORPHE" >> "$GITHUB_ENV"

      # ======================================================
      # UPDATE CHANGELOG
      # ======================================================

      - name: Update Release changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="$RELEASE_TAG"

          MAIN_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_MAIN_VERSION}"
          DEV_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_DEV_VERSION}"

          # --------------------------------------------------
          # GET EXISTING CHANGELOG
          # --------------------------------------------------

          if gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > release.json 2>/dev/null; then

            jq -r '.body // ""' \
              release.json \
              > release_notes.txt

          else

            touch release_notes.txt

          fi

          # --------------------------------------------------
          # REMOVE OLD GENERATED SECTIONS
          # --------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("release_notes.txt")

          text = path.read_text() if path.exists() else ""

          text = re.sub(
              r'(?ms)^## Morphe Patch.*?(?=^## |\Z)',
              '',
              text
          )

          text = re.sub(
              r'(?ms)^## MicroG.*?(?=^## |\Z)',
              '',
              text
          )

          path.write_text(text.strip() + "\n")
          PY

          # --------------------------------------------------
          # ADD MORPHE + MICROG CHANGELOG
          # --------------------------------------------------

          cat >> release_notes.txt <<EOF

          ## Morphe Patch

          ### Stable

          **${MORPHE_MAIN_VERSION}**

          [Morphe Patch ${MORPHE_MAIN_VERSION} Changelog](${MAIN_URL})

          ### Dev

          **${MORPHE_DEV_VERSION}**

          [Morphe Patch ${MORPHE_DEV_VERSION} Changelog](${DEV_URL})

          ## MicroG

          MicroG is required for **YouTube Non-root**.

          [Download MicroG from MorpheApp/MicroG-RE](${MICROG_URL})

          ## YouTube

          - Stable: ${MAIN_VERSION}
          - Dev: ${DEV_VERSION}

          ## Build

          - Stable Non-root
          - Stable Root Magisk
          - Dev Non-root
          - Dev Root Magisk
          EOF

      # ======================================================
      # CREATE / UPDATE RELEASE
      # ======================================================

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="$RELEASE_TAG"

          RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"

          NOTES_JSON="$(jq -Rs . < release_notes.txt)"

          HTTP_CODE="$(
            curl \
              -s \
              -o release_check.json \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${RELEASE_API}/tags/${TAG}"
          )"

          if [ "$HTTP_CODE" = "200" ]; then

            RELEASE_ID="$(jq -r '.id' release_check.json)"

            echo "Updating Release ID: $RELEASE_ID"

            curl \
              -fsSL \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "${RELEASE_API}/${RELEASE_ID}" \
              -d "{
                \"name\": \"YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}\",
                \"body\": ${NOTES_JSON}
              }"

          elif [ "$HTTP_CODE" = "404" ]; then

            echo "Release does not exist."
            echo "Creating release..."

            curl \
              -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "${RELEASE_API}" \
              -d "{
                \"tag_name\": \"${TAG}\",
                \"name\": \"YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}\",
                \"body\": ${NOTES_JSON},
                \"draft\": false,
                \"prerelease\": false
              }"

          else

            echo "ERROR: Cannot check Release."
            cat release_check.json
            exit 1

          fi

      # ======================================================
      # UPLOAD APK / ZIP ONLY
      # ======================================================

      - name: Upload Release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ ! -d release ]; then
            echo "No release artifacts."
            exit 0
          fi

          while IFS= read -r -d '' FILE; do

            echo "Uploading: $FILE"

            gh release upload \
              "$RELEASE_TAG" \
              "$FILE" \
              --clobber

          done < <(
            find release \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.zip" \
              \) \
              -print0
          )

      # ======================================================
      # SUMMARY
      # ======================================================

      - name: Summary
        shell: bash
        run: |
          echo "======================================"
          echo "YouTube Morphe completed"
          echo "======================================"
          echo "YouTube Stable : $MAIN_VERSION"
          echo "YouTube Dev    : $DEV_VERSION"
          echo "Morphe Stable  : $MORPHE_MAIN_VERSION"
          echo "Morphe Dev     : $MORPHE_DEV_VERSION"
          echo "MicroG         : $MICROG_URL"
          echo "Release        : $RELEASE_TAG"
          echo "======================================"


  # ==========================================================
  # CLEANUP
  # ==========================================================

  cleanup:
    name: Cleanup Releases and Workflows

    needs:
      - release

    if: needs.release.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:

      - name: Install jq
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq

      # ======================================================
      # RELEASE CLEANUP
      # KEEP 3
      # ======================================================

      - name: Cleanup old releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "RELEASE CLEANUP"
          echo "Keep newest 3"
          echo "======================================"

          curl \
            -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > releases.json

          jq '
            sort_by(.published_at // .created_at)
            | reverse
          ' releases.json > releases_sorted.json

          TOTAL="$(jq 'length' releases_sorted.json)"

          echo "Total releases: $TOTAL"

          if [ "$TOTAL" -le 3 ]; then

            echo "Nothing to delete."

          else

            jq -r '
              .[3:]
              | .[]
              | "\(.id)|\(.tag_name)"
            ' releases_sorted.json |
            while IFS='|' read -r RELEASE_ID TAG; do

              [ -z "$RELEASE_ID" ] && continue

              echo "--------------------------------------"
              echo "Deleting Release"
              echo "ID: $RELEASE_ID"
              echo "TAG: $TAG"

              HTTP_CODE="$(
                curl \
                  -s \
                  -o /tmp/release_delete.txt \
                  -w "%{http_code}" \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
              )"

              if [ "$HTTP_CODE" = "204" ]; then

                echo "Release deleted."

              elif [ "$HTTP_CODE" = "404" ]; then

                echo "Release already deleted."

              else

                echo "ERROR deleting Release: HTTP $HTTP_CODE"
                cat /tmp/release_delete.txt
                exit 1

              fi

              # ------------------------------------------------
              # DELETE TAG
              # ------------------------------------------------

              TAG_CODE="$(
                curl \
                  -s \
                  -o /tmp/tag_delete.txt \
                  -w "%{http_code}" \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              )"

              if [ "$TAG_CODE" = "204" ]; then

                echo "Tag deleted."

              elif [ "$TAG_CODE" = "404" ]; then

                echo "Tag already deleted."

              else

                echo "WARNING: Tag deletion HTTP $TAG_CODE"
                cat /tmp/tag_delete.txt || true

              fi

            done

          fi

      # ======================================================
      # WORKFLOW CLEANUP
      # KEEP 3
      # NO GIT COMMAND
      # ======================================================

      - name: Cleanup old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "WORKFLOW CLEANUP"
          echo "Keep newest 3"
          echo "======================================"

          WORKFLOW_ID="$(
            curl \
              -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" |
            jq -r '
              .workflows[]
              | select(.path == ".github/workflows/patch.yml")
              | .id
            ' |
            head -n 1
          )"

          if [ -z "$WORKFLOW_ID" ] || [ "$WORKFLOW_ID" = "null" ]; then
            echo "ERROR: patch.yml workflow not found"
            exit 1
          fi

          echo "Workflow ID: $WORKFLOW_ID"

          curl \
            -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            > workflow_runs_response.json

          jq '
            .workflow_runs
            | sort_by(.created_at)
            | reverse
          ' workflow_runs_response.json > workflow_runs.json

          TOTAL="$(jq 'length' workflow_runs.json)"

          echo "Total workflow runs: $TOTAL"

          if [ "$TOTAL" -le 3 ]; then

            echo "Nothing to delete."

          else

            jq -r '
              .[3:]
              | .[].id
            ' workflow_runs.json |
            while IFS= read -r RUN_ID; do

              [ -z "$RUN_ID" ] && continue

              echo "Deleting workflow run: $RUN_ID"

              HTTP_CODE="$(
                curl \
                  -s \
                  -o /tmp/run_delete.txt \
                  -w "%{http_code}" \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
              )"

              case "$HTTP_CODE" in

                204)
                  echo "Workflow run deleted."
                  ;;

                404)
                  echo "Workflow run already deleted."
                  ;;

                403)
                  echo "ERROR: Actions permission denied."
                  cat /tmp/run_delete.txt
                  exit 1
                  ;;

                *)
                  echo "ERROR: HTTP $HTTP_CODE"
                  cat /tmp/run_delete.txt
                  exit 1
                  ;;

              esac

            done

          fi

          echo "======================================"
          echo "CLEANUP COMPLETE"
          echo "======================================"
