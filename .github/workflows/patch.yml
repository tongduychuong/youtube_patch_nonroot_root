name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:

  main:
    name: Stable
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "YouTube: $INPUT"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Stable Non Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-${VERSION}.apk"

      - name: Patch Stable Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-morphe-root-apk-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-root-apk-${VERSION}.apk"

      - name: Create Stable Magisk Module
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y p7zip-full

          rm -rf root-module

          mkdir -p root-module/stock
          mkdir -p root-module/patched
          mkdir -p root-module/system

          cp "$INPUT" \
            root-module/stock/YouTube.apk

          cp "youtube-morphe-root-apk-${VERSION}.apk" \
            root-module/patched/YouTube.apk

          cat > root-module/module.prop <<EOF
          id=youtube_morphe
          name=YouTube Morphe Root
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe Root Magisk Module
          EOF

          cat > root-module/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Root"
          ui_print "======================================"
          ui_print "Stock APK included"
          ui_print "Patched APK included"
          ui_print "GmsCore support: Disabled"
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          STOCK="$MODDIR/stock/YouTube.apk"
          PATCHED="$MODDIR/patched/YouTube.apk"

          PKG="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe.log"

          exec >>"$LOG" 2>&1

          echo "======================================"
          echo "YouTube Morphe Root"
          echo "======================================"

          if [ ! -f "$STOCK" ]; then
              echo "ERROR: Stock APK missing"
              exit 1
          fi

          if [ ! -f "$PATCHED" ]; then
              echo "ERROR: Patched APK missing"
              exit 1
          fi

          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done

          sleep 5

          echo "Detecting YouTube APK..."

          PATHS="$(
              pm path "$PKG" 2>/dev/null |
              sed 's/^package://'
          )"

          if [ -z "$PATHS" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          echo "Detected:"
          echo "$PATHS"

          TARGET=""

          while IFS= read -r APK_PATH; do

              [ -z "$APK_PATH" ] && continue

              case "$APK_PATH" in

                  /system/*/YouTube/*/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  /system/*/YouTube/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  /product/*/YouTube/*/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  /product/*/YouTube/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  /system_ext/*/YouTube/*/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  /system_ext/*/YouTube/base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  */base.apk)
                      if [ -z "$TARGET" ]; then
                          TARGET="$APK_PATH"
                      fi
                      ;;

                  *.apk)
                      if [ -z "$TARGET" ]; then
                          TARGET="$APK_PATH"
                      fi
                      ;;

              esac

          done <<EOF_PATHS
          $PATHS
          EOF_PATHS

          if [ -z "$TARGET" ]; then
              echo "ERROR: YouTube APK target not found"
              exit 1
          fi

          echo "Target:"
          echo "$TARGET"

          case "$TARGET" in

              /system/*)
                  RELATIVE="${TARGET#/system/}"
                  OVERLAY="$MODDIR/system/$RELATIVE"
                  ;;

              /product/*)
                  RELATIVE="${TARGET#/product/}"
                  OVERLAY="$MODDIR/product/$RELATIVE"
                  ;;

              /system_ext/*)
                  RELATIVE="${TARGET#/system_ext/}"
                  OVERLAY="$MODDIR/system_ext/$RELATIVE"
                  ;;

              /vendor/*)
                  RELATIVE="${TARGET#/vendor/}"
                  OVERLAY="$MODDIR/vendor/$RELATIVE"
                  ;;

              *)
                  echo "ERROR: Unsupported system path"
                  exit 1
                  ;;

          esac

          echo "Overlay:"
          echo "$OVERLAY"

          mkdir -p "$(dirname "$OVERLAY")"

          cp "$PATCHED" "$OVERLAY"

          chmod 0644 "$OVERLAY"

          echo "Magisk overlay prepared"

          echo "Stock APK:"
          ls -lh "$STOCK"

          echo "Patched APK:"
          ls -lh "$PATCHED"

          echo "Overlay APK:"
          ls -lh "$OVERLAY"

          echo "======================================"
          echo "SUCCESS"
          echo "======================================"

          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          7z a \
            -tzip \
            -mx=9 \
            -mfb=258 \
            -mpass=15 \
            "../youtube-morphe-root-${VERSION}.zip" \
            .

          cd ..

          test -f "youtube-morphe-root-${VERSION}.zip"

          echo "Stable root module:"
          ls -lh "youtube-morphe-root-${VERSION}.zip"

          7z l "youtube-morphe-root-${VERSION}.zip"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-root-${{ env.VERSION }}.zip
          retention-days: 1


  dev:
    name: Dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read dev version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Dev Non Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-${VERSION}.apk"

      - name: Patch Dev Root
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-root-apk-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-root-apk-${VERSION}.apk"

      - name: Create Dev Magisk Module
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y p7zip-full

          rm -rf root-module

          mkdir -p root-module/stock
          mkdir -p root-module/patched
          mkdir -p root-module/system

          cp "$INPUT" \
            root-module/stock/YouTube.apk

          cp "youtube-morphe-dev-root-apk-${VERSION}.apk" \
            root-module/patched/YouTube.apk

          cat > root-module/module.prop <<EOF
          id=youtube_morphe_dev
          name=YouTube Morphe Dev Root
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe Dev Magisk Module
          EOF

          cat > root-module/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Dev Root"
          ui_print "======================================"
          ui_print "Stock APK included"
          ui_print "Patched APK included"
          ui_print "GmsCore support: Disabled"
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          STOCK="$MODDIR/stock/YouTube.apk"
          PATCHED="$MODDIR/patched/YouTube.apk"

          PKG="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe_dev.log"

          exec >>"$LOG" 2>&1

          echo "YouTube Morphe Dev Root"

          if [ ! -f "$STOCK" ]; then
              echo "ERROR: Stock APK missing"
              exit 1
          fi

          if [ ! -f "$PATCHED" ]; then
              echo "ERROR: Patched APK missing"
              exit 1
          fi

          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done

          sleep 5

          PATHS="$(
              pm path "$PKG" 2>/dev/null |
              sed 's/^package://'
          )"

          if [ -z "$PATHS" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          TARGET=""

          while IFS= read -r APK_PATH; do

              [ -z "$APK_PATH" ] && continue

              case "$APK_PATH" in
                  /system/*)
                      TARGET="$APK_PATH"
                      break
                      ;;
                  /product/*)
                      TARGET="$APK_PATH"
                      break
                      ;;
                  /system_ext/*)
                      TARGET="$APK_PATH"
                      break
                      ;;
                  /vendor/*)
                      TARGET="$APK_PATH"
                      break
                      ;;
              esac

          done <<EOF_PATHS
          $PATHS
          EOF_PATHS

          if [ -z "$TARGET" ]; then
              echo "ERROR: System YouTube APK not found"
              exit 1
          fi

          case "$TARGET" in
              /system/*)
                  RELATIVE="${TARGET#/system/}"
                  OVERLAY="$MODDIR/system/$RELATIVE"
                  ;;
              /product/*)
                  RELATIVE="${TARGET#/product/}"
                  OVERLAY="$MODDIR/product/$RELATIVE"
                  ;;
              /system_ext/*)
                  RELATIVE="${TARGET#/system_ext/}"
                  OVERLAY="$MODDIR/system_ext/$RELATIVE"
                  ;;
              /vendor/*)
                  RELATIVE="${TARGET#/vendor/}"
                  OVERLAY="$MODDIR/vendor/$RELATIVE"
                  ;;
              *)
                  echo "ERROR: Unsupported path"
                  exit 1
                  ;;
          esac

          mkdir -p "$(dirname "$OVERLAY")"

          cp "$PATCHED" "$OVERLAY"

          chmod 0644 "$OVERLAY"

          echo "Overlay prepared:"
          echo "$OVERLAY"

          echo "SUCCESS"
          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          7z a \
            -tzip \
            -mx=9 \
            -mfb=258 \
            -mpass=15 \
            "../youtube-morphe-dev-root-${VERSION}.zip" \
            .

          cd ..

          test -f "youtube-morphe-dev-root-${VERSION}.zip"

          7z l "youtube-morphe-dev-root-${VERSION}.zip"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-root-${{ env.VERSION }}.zip
          retention-days: 1


  release:
    name: Common Release
    needs:
      - main
      - dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Get Versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-*.apk" \
              ! -name "youtube-morphe-root-apk-*" |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-dev-*.apk" \
              ! -name "youtube-morphe-dev-root-apk-*" |
            head -n 1
          )"

          test -n "$MAIN_APK"
          test -n "$DEV_APK"

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed "s/^youtube-morphe-//" |
            sed "s/\.apk$//"
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed "s/^youtube-morphe-dev-//" |
            sed "s/\.apk$//"
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

              Stable: ${MAIN_VERSION}
              Dev: ${DEV_VERSION}
              
              Non-root:
              Custom branding disabled
              GmsCore support enabled
              
              Root:
              Custom branding disabled
              GmsCore support disabled
              
              Root module:
              Stock APK included
              Patched APK included
              Automatic YouTube path detection
              Magisk overlay
              7-Zip compression"
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}"

          gh release upload \
            "$TAG" \
            release/*.apk \
            release/*.zip \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
