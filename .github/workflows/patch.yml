name: Patch YouTube with Morphe

on:
  workflow_dispatch:

  push:
    paths:
      - "version.txt"
      - "version_dev.txt"
      - ".github/workflows/patch.yml"
      - "scripts/download_youtube.js"

  schedule:
    # 23:00 Vietnam time (UTC+7)
    # = 16:00 UTC
    - cron: "0 16 * * *"


permissions:
  contents: write


jobs:

  # ==================================================
  # MAIN
  # ==================================================

  main:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT MAIN
      # ==================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main


      # ==================================================
      # JAVA 21
      # ==================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # CHECK JAVA
      # ==================================================

      - name: Check Java
        shell: bash
        run: |
          set -e

          java -version


      # ==================================================
      # READ VERSION
      # ==================================================

      - name: Read main version
        shell: bash
        run: |
          set -e

          if [ ! -f "version.txt" ]; then
            echo "ERROR: version.txt not found"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "MAIN VERSION: $VERSION"
          echo "======================================"


      # ==================================================
      # DOWNLOAD YOUTUBE
      # ==================================================

      - name: Download YouTube from APKMirror
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: scripts/download_youtube.js not found"
            exit 1
          fi

          node scripts/download_youtube.js


      # ==================================================
      # CHECK APK
      # ==================================================

      - name: Check YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found:"
            echo "$APK"
            exit 1
          fi

          ls -lh "$APK"


      # ==================================================
      # DOWNLOAD MORPHE CLI
      # ==================================================

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL "$API" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          echo "Morphe CLI:"
          echo "$URL"

          wget \
            -q \
            --show-progress \
            "$URL" \
            -O morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

          ls -lh morphe-cli.jar


      # ==================================================
      # PATCH MAIN
      # ==================================================

      - name: Patch YouTube MAIN
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "======================================"
          echo "PATCH MAIN"
          echo "VERSION: $VERSION"
          echo "PATCHES: MAIN"
          echo "======================================"

          java \
            -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            "$APK"


      # ==================================================
      # FIND PATCHED APK
      # ==================================================

      - name: Find patched APK
        shell: bash
        run: |
          set -e

          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -printf '%p %s bytes\n'


      # ==================================================
      # RENAME
      # ==================================================

      - name: Rename main APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          ORIGINAL="com.google.android.youtube-${VERSION}-all.apk"

          SOURCE="$(
            find . \
              -type f \
              -name "*.apk" |
            grep -v "$ORIGINAL" |
            head -n 1
          )"

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Patched APK not found"
            exit 1
          fi

          OUTPUT="youtube-morphe-${VERSION}.apk"

          cp "$SOURCE" "$OUTPUT"

          ls -lh "$OUTPUT"


      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate main SHA256
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="youtube-morphe-${VERSION}.apk"

          sha256sum \
            "$APK" \
            > "${APK}.sha256"

          cat "${APK}.sha256"


      # ==================================================
      # UPLOAD MAIN ARTIFACT
      # ==================================================

      - name: Upload main APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-main
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-${{ env.VERSION }}.apk.sha256
          retention-days: 1


  # ==================================================
  # DEV
  # ==================================================

  dev:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT DEV
      # ==================================================

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev


      # ==================================================
      # JAVA 21
      # ==================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ==================================================
      # CHECK JAVA
      # ==================================================

      - name: Check Java
        shell: bash
        run: |
          set -e

          java -version


      # ==================================================
      # READ DEV VERSION
      # ==================================================

      - name: Read dev version
        shell: bash
        run: |
          set -e

          if [ ! -f "version_dev.txt" ]; then
            echo "ERROR: version_dev.txt not found"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "DEV VERSION: $VERSION"
          echo "======================================"


      # ==================================================
      # DOWNLOAD YOUTUBE
      # ==================================================

      - name: Download YouTube from APKMirror
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: scripts/download_youtube.js not found"
            exit 1
          fi

          node scripts/download_youtube.js


      # ==================================================
      # CHECK APK
      # ==================================================

      - name: Check YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found:"
            echo "$APK"
            exit 1
          fi

          ls -lh "$APK"


      # ==================================================
      # DOWNLOAD MORPHE CLI
      # ==================================================

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL "$API" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          echo "Morphe CLI:"
          echo "$URL"

          wget \
            -q \
            --show-progress \
            "$URL" \
            -O morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

          ls -lh morphe-cli.jar


      # ==================================================
      # PATCH DEV
      # ==================================================

      - name: Patch YouTube DEV
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "======================================"
          echo "PATCH DEV"
          echo "VERSION: $VERSION"
          echo "PATCHES: DEV / PRERELEASE"
          echo "======================================"

          java \
            -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            "$APK"


      # ==================================================
      # FIND PATCHED APK
      # ==================================================

      - name: Find patched APK
        shell: bash
        run: |
          set -e

          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -printf '%p %s bytes\n'


      # ==================================================
      # RENAME
      # ==================================================

      - name: Rename dev APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          ORIGINAL="com.google.android.youtube-${VERSION}-all.apk"

          SOURCE="$(
            find . \
              -type f \
              -name "*.apk" |
            grep -v "$ORIGINAL" |
            head -n 1
          )"

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Patched DEV APK not found"
            exit 1
          fi

          OUTPUT="youtube-morphe-dev-${VERSION}.apk"

          cp "$SOURCE" "$OUTPUT"

          ls -lh "$OUTPUT"


      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate dev SHA256
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="youtube-morphe-dev-${VERSION}.apk"

          sha256sum \
            "$APK" \
            > "${APK}.sha256"

          cat "${APK}.sha256"


      # ==================================================
      # UPLOAD DEV ARTIFACT
      # ==================================================

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-${{ env.VERSION }}.apk.sha256
          retention-days: 1


  # ==================================================
  # RELEASE
  #
  # MAIN + DEV chạy xong mới chạy job này
  # ==================================================

  release:

    needs:
      - main
      - dev

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # DOWNLOAD MAIN ARTIFACT
      # ==================================================

      - name: Download main artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-main
          path: release


      # ==================================================
      # DOWNLOAD DEV ARTIFACT
      # ==================================================

      - name: Download dev artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release


      # ==================================================
      # LIST FILES
      # ==================================================

      - name: List release files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          ls -lh release


      # ==================================================
      # READ VERSIONS
      # ==================================================

      - name: Read versions
        shell: bash
        run: |
          set -e

          MAIN_VERSION="$(
            tr -d '\r\n' < <(
              git show origin/main:version.txt 2>/dev/null ||
              git show HEAD:version.txt
            ) |
            xargs
          )"

          DEV_VERSION="$(
            tr -d '\r\n' < <(
              git show origin/dev:version_dev.txt 2>/dev/null ||
              echo ""
            ) |
            xargs
          )"

          # Lấy version trực tiếp từ artifact filenames nếu checkout
          # không có origin branches.

          MAIN_FILE="$(
            find release \
              -name 'youtube-morphe-*.apk' |
            head -n 1
          )"

          DEV_FILE="$(
            find release \
              -name 'youtube-morphe-dev-*.apk' |
            head -n 1
          )"

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: Main APK missing"
            exit 1
          fi

          if [ -z "$DEV_FILE" ]; then
            echo "ERROR: Dev APK missing"
            exit 1
          fi

          MAIN_VERSION="$(
            basename "$MAIN_FILE" |
            sed -E 's/^youtube-morphe-(.*)\.apk$/\1/'
          )"

          DEV_VERSION="$(
            basename "$DEV_FILE" |
            sed -E 's/^youtube-morphe-dev-(.*)\.apk$/\1/'
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

          echo "MAIN VERSION: $MAIN_VERSION"
          echo "DEV VERSION: $DEV_VERSION"


      # ==================================================
      # CREATE ONE RELEASE
      # ==================================================

      - name: Create combined release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Dùng tag cố định để MAIN + DEV nằm chung 1 Release
          TAG="youtube-morphe"

          echo "======================================"
          echo "CREATE COMBINED RELEASE"
          echo "TAG: $TAG"
          echo "MAIN: $MAIN_VERSION"
          echo "DEV:  $DEV_VERSION"
          echo "======================================"


          # ------------------------------------------------
          # DELETE RELEASE CŨ
          # ------------------------------------------------

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Deleting old release..."

            gh release delete \
              "$TAG" \
              --yes

          fi


          # ------------------------------------------------
          # CREATE RELEASE
          # ------------------------------------------------

          gh release create \
            "$TAG" \
            release/*.apk \
            release/*.sha256 \
            --title \
            "YouTube Morphe - Main ${MAIN_VERSION} / Dev ${DEV_VERSION}" \
            --notes \
                "## YouTube Morphe
                
                ### Main
                - Version: ${MAIN_VERSION}
                - Patches: Morphe main
                
                ### Dev
                - Version: ${DEV_VERSION}
                - Patches: Morphe dev / prerelease
                
                Generated automatically by GitHub Actions at 23:00 Vietnam time."
