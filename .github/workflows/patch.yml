name: YouTube Morphe Patch

"on":
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Stable + Dev"
        required: false
        type: boolean
        default: true

  schedule:
    # 05:00 Vietnam time (UTC+7) = 22:00 UTC
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  RELEASE_TAG: youtube-morphe

jobs:

  # ==========================================================
  # STABLE
  # ==========================================================

  stable:
    name: Stable
    runs-on: ubuntu-latest

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl \
            jq

      # ======================================================
      # YOUTUBE VERSION
      # ======================================================

      - name: Read stable YouTube version
        shell: bash
        run: |
          set -e

          test -f version.txt

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "YouTube Stable: $VERSION"

      # ======================================================
      # MORPHE MAIN RELEASE
      # ======================================================

      - name: Get Morphe main release
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          TAG="$(
            echo "$RESPONSE" |
            jq -r '.tag_name'
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Morphe main release not found"
            exit 1
          fi

          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          echo "Morphe Main: $TAG"

      # ======================================================
      # CHECK PATCH VERSION
      # ======================================================

      - name: Check stable patch version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "======================================"
            echo "MANUAL RUN"
            echo "Force Stable build: YES"
            echo "======================================"

            echo "BUILD_STABLE=true" >> "$GITHUB_ENV"

            exit 0

          fi

          BUILD="true"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            gh release view "$RELEASE_TAG" \
              --json body \
              --jq '.body' \
              > release_notes.txt

            if grep -Fq \
              "Morphe Patch ${MORPHE_VERSION} Changelog" \
              release_notes.txt; then

              echo "Morphe $MORPHE_VERSION already built"
              BUILD="false"

            else

              echo "New Stable patch: $MORPHE_VERSION"

            fi

          else

            echo "Release does not exist."
            echo "Stable will build."

          fi

          echo "BUILD_STABLE=$BUILD" >> "$GITHUB_ENV"

      # ======================================================
      # DOWNLOAD YOUTUBE
      # ======================================================

      - name: Download YouTube
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          node scripts/download_youtube.js "$VERSION"

      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find YouTube APK
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Input: $INPUT"

      # ======================================================
      # MORPHE CLI
      # ======================================================

      - name: Download Morphe CLI
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"
          )"

          URL="$(
            echo "$RESPONSE" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # ======================================================
      # BUILD NON ROOT
      # ======================================================

      - name: Build Stable Non Root
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      # ======================================================
      # BUILD ROOT
      # ======================================================

      - name: Build Stable Root
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      # ======================================================
      # KEYSTORE
      # ======================================================

      - name: Commit encrypted keystore
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e

          test -f keys/keystore.enc

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc unchanged"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Stable
        if: env.BUILD_STABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  # ==========================================================
  # DEV
  # ==========================================================

  dev:
    name: Dev
    runs-on: ubuntu-latest

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl \
            jq

      # ======================================================
      # YOUTUBE DEV VERSION
      # ======================================================

      - name: Read dev YouTube version
        shell: bash
        run: |
          set -e

          test -f version_dev.txt

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "YouTube Dev: $VERSION"

      # ======================================================
      # MORPHE DEV RELEASE
      # ======================================================

      - name: Get Morphe dev release
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          TAG="$(
            echo "$RESPONSE" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | .tag_name
              ][0]
            '
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Morphe dev release not found"
            exit 1
          fi

          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          echo "Morphe Dev: $TAG"

      # ======================================================
      # CHECK PATCH VERSION
      # ======================================================

      - name: Check dev patch version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "======================================"
            echo "MANUAL RUN"
            echo "Force Dev build: YES"
            echo "======================================"

            echo "BUILD_DEV=true" >> "$GITHUB_ENV"

            exit 0

          fi

          BUILD="true"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            gh release view "$RELEASE_TAG" \
              --json body \
              --jq '.body' \
              > release_notes.txt

            if grep -Fq \
              "Morphe Patch ${MORPHE_VERSION} Changelog" \
              release_notes.txt; then

              echo "Morphe $MORPHE_VERSION already built"
              BUILD="false"

            else

              echo "New Dev patch: $MORPHE_VERSION"

            fi

          else

            echo "Release does not exist."
            echo "Dev will build."

          fi

          echo "BUILD_DEV=$BUILD" >> "$GITHUB_ENV"

      # ======================================================
      # DOWNLOAD YOUTUBE
      # ======================================================

      - name: Download YouTube
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          node scripts/download_youtube.js "$VERSION"

      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find YouTube APK
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      # ======================================================
      # MORPHE CLI
      # ======================================================

      - name: Download Morphe CLI
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"
          )"

          URL="$(
            echo "$RESPONSE" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      # ======================================================
      # BUILD NON ROOT
      # ======================================================

      - name: Build Dev Non Root
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      # ======================================================
      # BUILD ROOT
      # ======================================================

      - name: Build Dev Root
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      # ======================================================
      # KEYSTORE
      # ======================================================

      - name: Commit encrypted keystore
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e

          test -f keys/keystore.enc

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc unchanged"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Dev
        if: env.BUILD_DEV == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube_dev_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  # ==========================================================
  # RELEASE
  # ==========================================================

  release:
    name: Common Release

    needs:
      - stable
      - dev

    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # DOWNLOAD ARTIFACTS
      # ======================================================

      - name: Download Stable
        if: needs.stable.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        if: needs.dev.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      # ======================================================
      # READ VERSIONS
      # ======================================================

      - name: Read YouTube versions
        shell: bash
        run: |
          set -e

          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      # ======================================================
      # MORPHE VERSIONS
      # ======================================================

      - name: Get current Morphe versions
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq

          MAIN_RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          MAIN_MORPHE="$(
            echo "$MAIN_RESPONSE" |
            jq -r '.tag_name'
          )"

          DEV_RESPONSE="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          DEV_MORPHE="$(
            echo "$DEV_RESPONSE" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | .tag_name
              ][0]
            '
          )"

          echo "MORPHE_MAIN_VERSION=$MAIN_MORPHE" >> "$GITHUB_ENV"
          echo "MORPHE_DEV_VERSION=$DEV_MORPHE" >> "$GITHUB_ENV"

      # ======================================================
      # CHANGELOG
      # ======================================================

      - name: Update Release changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="$RELEASE_TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release view "$TAG" \
              --json body \
              --jq '.body' \
              > release_notes.txt

          else

            touch release_notes.txt

          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("release_notes.txt")

          text = path.read_text() if path.exists() else ""

          text = re.sub(
              r'(?ms)^## Morphe Patch.*?(?=^## |\Z)',
              '',
              text
          )

          path.write_text(text.strip() + "\n")
          PY

          cat >> release_notes.txt <<EOF

          ## YouTube

          - Stable: ${MAIN_VERSION}
          - Dev: ${DEV_VERSION}

          ## Morphe Patch

          ### Stable

          **${MORPHE_MAIN_VERSION}**

          [Morphe Patch ${MORPHE_MAIN_VERSION} Changelog](https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_MAIN_VERSION})

          ### Dev

          **${MORPHE_DEV_VERSION}**

          [Morphe Patch ${MORPHE_DEV_VERSION} Changelog](https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_DEV_VERSION})

          EOF

      # ======================================================
      # CREATE / UPDATE RELEASE
      # ======================================================

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="$RELEASE_TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release edit "$TAG" \
              --title \
              "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes-file release_notes.txt

          else

            gh release create "$TAG" \
              --title \
              "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes-file release_notes.txt

          fi

      # ======================================================
      # UPLOAD APK / ZIP
      # ======================================================

      - name: Upload Release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ ! -d release ]; then
            echo "No release artifacts."
            exit 0
          fi

          while IFS= read -r -d '' FILE; do

            echo "Uploading: $FILE"

            gh release upload \
              "$RELEASE_TAG" \
              "$FILE" \
              --clobber

          done < <(
            find release \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.zip" \
              \) \
              -print0
          )

      - name: Summary
        shell: bash
        run: |
          echo "======================================"
          echo "YouTube Morphe completed"
          echo "======================================"
          echo "YouTube Stable : $MAIN_VERSION"
          echo "YouTube Dev    : $DEV_VERSION"
          echo "Morphe Stable  : $MORPHE_MAIN_VERSION"
          echo "Morphe Dev     : $MORPHE_DEV_VERSION"
          echo "Release        : $RELEASE_TAG"
          echo "======================================"


  # ==========================================================
  # CLEANUP
  # ==========================================================

  cleanup:
    name: Cleanup Old Releases and Workflows

    needs:
      - release

    if: needs.release.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:

      - name: Install jq
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq

      # ======================================================
      # RELEASE + TAG
      # KEEP 3
      # ======================================================

      - name: Cleanup old releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "RELEASE CLEANUP"
          echo "Keep newest 3"
          echo "======================================"

          gh release list \
            --limit 100 \
            --json tagName,publishedAt \
            > releases.json

          TOTAL="$(jq 'length' releases.json)"

          echo "Total releases: $TOTAL"

          if [ "$TOTAL" -gt 3 ]; then

            jq -r '
              sort_by(.publishedAt)
              | reverse
              | .[3:]
              | .[].tagName
            ' releases.json |
            while IFS= read -r TAG; do

              [ -z "$TAG" ] && continue

              echo "Deleting release: $TAG"

              gh release delete \
                "$TAG" \
                --yes

              echo "Deleting tag: $TAG"

              gh api \
                --method DELETE \
                "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                || true

            done

          else

            echo "Release count <= 3"
            echo "Nothing to delete."

          fi

      # ======================================================
      # WORKFLOW RUNS
      # KEEP 3
      # ======================================================

      - name: Cleanup old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "WORKFLOW RUN CLEANUP"
          echo "Workflow: patch.yml"
          echo "Keep newest 3"
          echo "======================================"

          WORKFLOW_ID="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows" |
            jq -r '
              .workflows[]
              | select(.path == ".github/workflows/patch.yml")
              | .id
            ' |
            head -n 1
          )"

          if [ -z "$WORKFLOW_ID" ] || [ "$WORKFLOW_ID" = "null" ]; then

            echo "ERROR: patch.yml workflow not found"
            exit 1

          fi

          echo "Workflow ID: $WORKFLOW_ID"

          gh api \
            --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            > workflow_pages.json

          jq -s '
            map(.workflow_runs)
            | add
            | unique_by(.id)
            | sort_by(.created_at)
            | reverse
          ' workflow_pages.json > workflow_runs.json

          TOTAL="$(jq 'length' workflow_runs.json)"

          echo "Total runs: $TOTAL"

          if [ "$TOTAL" -le 3 ]; then

            echo "Workflow runs <= 3"
            echo "Nothing to delete."

          else

            echo "Deleting $((TOTAL - 3)) old runs..."

            jq -r '
              .[3:]
              | .[].id
            ' workflow_runs.json |
            while IFS= read -r RUN_ID; do

              [ -z "$RUN_ID" ] && continue

              echo "--------------------------------------"
              echo "Deleting workflow run: $RUN_ID"

              HTTP_CODE="$(
                curl \
                  -s \
                  -o /tmp/delete_response.txt \
                  -w "%{http_code}" \
                  -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
              )"

              if [ "$HTTP_CODE" = "204" ]; then

                echo "Deleted successfully."

              elif [ "$HTTP_CODE" = "404" ]; then

                echo "Already deleted / not found."

              else

                echo "ERROR: HTTP $HTTP_CODE"
                cat /tmp/delete_response.txt

                exit 1

              fi

            done

          fi

          echo "======================================"
          echo "CLEANUP COMPLETE"
          echo "======================================"
