name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:

  main:
    name: Morphe Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Selected:"
          echo "$INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Stable
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-${VERSION}.apk"

      - name: Create Stable Magisk Module
        shell: bash
        run: |
          set -e

          rm -rf root-module

          mkdir -p root-module

          cp \
            "youtube-morphe-${VERSION}.apk" \
            "root-module/youtube-morphe.apk"

          cat > root-module/module.prop <<EOF
          id=youtube_morphe
          name=YouTube Morphe
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe patched module
          updateJson=
          EOF

          cat > root-module/customize.sh <<'EOF'
          ui_print "======================================"
          ui_print " YouTube Morphe"
          ui_print "======================================"
          ui_print "Installing patched YouTube..."
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"
          APK="$MODDIR/youtube-morphe.apk"

          LOG="/data/adb/youtube_morphe.log"

          echo "YouTube Morphe module started" > "$LOG"

          if [ ! -f "$APK" ]; then
              echo "ERROR: patched APK not found" >> "$LOG"
              exit 1
          fi

          echo "Patched APK found" >> "$LOG"
          echo "Waiting for Android package manager..." >> "$LOG"

          sleep 20

          PKG="com.google.android.youtube"

          PMPATH="$(pm path "$PKG" 2>/dev/null | head -n 1)"

          echo "Package path: $PMPATH" >> "$LOG"

          if [ -z "$PMPATH" ]; then
              echo "ERROR: YouTube package not found" >> "$LOG"
              exit 1
          fi

          TARGET="${PMPATH#package:}"

          echo "Target: $TARGET" >> "$LOG"

          mount --bind "$APK" "$TARGET" 2>>"$LOG"

          if [ $? -eq 0 ]; then
              echo "Mount successful" >> "$LOG"
          else
              echo "Mount failed" >> "$LOG"
          fi
          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          zip -r \
            "../youtube-morphe-root-${VERSION}.zip" \
            .

          cd ..

          test -f "youtube-morphe-root-${VERSION}.zip"

          ls -lh "youtube-morphe-root-${VERSION}.zip"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-root-${{ env.VERSION }}.zip
          retention-days: 1


  dev:
    name: Morphe Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read dev version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Dev
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-${VERSION}.apk"

      - name: Create Dev Magisk Module
        shell: bash
        run: |
          set -e

          rm -rf root-module

          mkdir -p root-module

          cp \
            "youtube-morphe-dev-${VERSION}.apk" \
            "root-module/youtube-morphe.apk"

          cat > root-module/module.prop <<EOF
          id=youtube_morphe_dev
          name=YouTube Morphe Dev
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe Dev patched module
          updateJson=
          EOF

          cat > root-module/customize.sh <<'EOF'
          ui_print "======================================"
          ui_print " YouTube Morphe Dev"
          ui_print "======================================"
          ui_print "Installing patched YouTube..."
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"
          APK="$MODDIR/youtube-morphe.apk"

          LOG="/data/adb/youtube_morphe_dev.log"

          echo "YouTube Morphe Dev module started" > "$LOG"

          if [ ! -f "$APK" ]; then
              echo "ERROR: patched APK not found" >> "$LOG"
              exit 1
          fi

          sleep 20

          PKG="com.google.android.youtube"

          PMPATH="$(pm path "$PKG" 2>/dev/null | head -n 1)"

          echo "Package path: $PMPATH" >> "$LOG"

          if [ -z "$PMPATH" ]; then
              echo "ERROR: YouTube package not found" >> "$LOG"
              exit 1
          fi

          TARGET="${PMPATH#package:}"

          echo "Target: $TARGET" >> "$LOG"

          mount --bind "$APK" "$TARGET" 2>>"$LOG"

          if [ $? -eq 0 ]; then
              echo "Mount successful" >> "$LOG"
          else
              echo "Mount failed" >> "$LOG"
          fi
          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          zip -r \
            "../youtube-morphe-dev-root-${VERSION}.zip" \
            .

          cd ..

          test -f "youtube-morphe-dev-root-${VERSION}.zip"

          ls -lh "youtube-morphe-dev-root-${VERSION}.zip"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-root-${{ env.VERSION }}.zip
          retention-days: 1


  release:
    name: Common Release
    needs:
      - main
      - dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: List Release Files
        shell: bash
        run: |
          set -e

          find release \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n"

      - name: Get Versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-*.apk" \
              ! -name "youtube-morphe-dev-*" |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-dev-*.apk" |
            head -n 1
          )"

          test -n "$MAIN_APK"
          test -n "$DEV_APK"

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed "s/^youtube-morphe-//" |
            sed "s/\.apk$//"
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed "s/^youtube-morphe-dev-//" |
            sed "s/\.apk$//"
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                Custom branding: Disabled
                
                Root modules:
                Magisk / KernelSU compatible module format."
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
            --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                Custom branding: Disabled
                
                Root modules:
                Magisk / KernelSU compatible module format."

          gh release upload \
            "$TAG" \
            release/*.apk \
            release/*.zip \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
