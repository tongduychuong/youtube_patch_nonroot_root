name: Build YouTube Morphe

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  stable:
    name: Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Read Stable Version
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          test -n "$VERSION"
          echo "YT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e
          test -f scripts/download_youtube.js
          node scripts/download_youtube.js "$YT_VERSION"

      - name: Prepare Stock APK
        shell: bash
        run: |
          set -e
          INPUT="$(find . -maxdepth 4 -type f -name '*.apk' \
            ! -name 'youtube_*.apk' \
            ! -name 'youtube_dev_*.apk' | head -n 1)"
          test -n "$INPUT"
          cp "$INPUT" youtube.apk
          ls -lh youtube.apk

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e
          API="https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest"
          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" "$API")"

          URL="$(echo "$RESPONSE" |
            grep -oE 'https://[^"]+\.jar' |
            grep -Ei 'morphe.*(cli|all)' |
            head -n 1)"

          test -n "$URL"

          curl -fL --retry 5 --retry-delay 3 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Download Morphe Stable Patches
        shell: bash
        run: |
          set -e
          API="https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest"

          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" "$API")"

          URL="$(echo "$RESPONSE" |
            grep -oE 'https://[^"]+\.mpp' |
            head -n 1)"

          test -n "$URL"

          curl -fL --retry 5 --retry-delay 3 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o patches.mpp

          test -s patches.mpp

          echo "PATCH_TAG=stable-${YT_VERSION}" >> "$GITHUB_ENV"

      - name: Create Signing Key
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          set -e

          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > signing.jks
          else
            keytool -genkeypair -v \
              -keystore signing.jks \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              -keypass "$KS_KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=YouTube Morphe"
          fi

          echo "KS_PATH=$GITHUB_WORKSPACE/signing.jks" >> "$GITHUB_ENV"

      - name: Build Stable
        shell: bash
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          set -e
          chmod +x build_module.sh
          ./build_module.sh stable

      - name: Upload Stable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube_*.apk
            youtube_root_mount_*.zip
          retention-days: 1

  dev:
    name: Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Read Dev Version
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"
          test -n "$VERSION"
          echo "YT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download YouTube
        shell: bash
        run: |
          set -e
          test -f scripts/download_youtube.js
          node scripts/download_youtube.js "$YT_VERSION"

      - name: Prepare Stock APK
        shell: bash
        run: |
          set -e
          INPUT="$(find . -maxdepth 4 -type f -name '*.apk' \
            ! -name 'youtube_*.apk' \
            ! -name 'youtube_dev_*.apk' | head -n 1)"
          test -n "$INPUT"
          cp "$INPUT" youtube.apk
          ls -lh youtube.apk

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e
          API="https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest"

          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" "$API")"

          URL="$(echo "$RESPONSE" |
            grep -oE 'https://[^"]+\.jar' |
            grep -Ei 'morphe.*(cli|all)' |
            head -n 1)"

          test -n "$URL"

          curl -fL --retry 5 --retry-delay 3 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Download Morphe Dev Patches
        shell: bash
        run: |
          set -e
          API="https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest"

          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: GitHubActions" "$API")"

          URL="$(echo "$RESPONSE" |
            grep -oE 'https://[^"]+\.mpp' |
            head -n 1)"

          test -n "$URL"

          curl -fL --retry 5 --retry-delay 3 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o patches.mpp

          test -s patches.mpp

          echo "PATCH_TAG=dev-${YT_VERSION}" >> "$GITHUB_ENV"

      - name: Create Signing Key
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          set -e

          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > signing.jks
          else
            keytool -genkeypair -v \
              -keystore signing.jks \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              -keypass "$KS_KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=YouTube Morphe"
          fi

          echo "KS_PATH=$GITHUB_WORKSPACE/signing.jks" >> "$GITHUB_ENV"

      - name: Build Dev
        shell: bash
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          set -e
          chmod +x build_module.sh
          ./build_module.sh dev

      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube_dev_*.apk
            youtube_dev_root_mount_*.zip
          retention-days: 1

  release:
    name: Common Release
    needs:
      - stable
      - dev
    runs-on: ubuntu-latest

    steps:
      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe" \
              --notes "Stable + Dev YouTube Morphe builds"
          fi

          gh release upload \
            "$TAG" \
            release/* \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
