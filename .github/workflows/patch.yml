name: Patch YouTube with Morphe

on:
  workflow_dispatch:

  schedule:
    # 23:00 giờ Việt Nam (UTC+7)
    # = 16:00 UTC
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:

  # ==================================================
  # MORPHE MAIN
  # ==================================================

  main:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java
        shell: bash
        run: |
          set -e
          java -version

      - name: Read main version
        shell: bash
        run: |
          set -e

          if [ ! -f "version.txt" ]; then
            echo "ERROR: Không tìm thấy version.txt"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt rỗng"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "MORPHE MAIN"
          echo "VERSION: $VERSION"
          echo "======================================"

      - name: Download YouTube from APKMirror
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: Không tìm thấy scripts/download_youtube.js"
            exit 1
          fi

          node scripts/download_youtube.js

      - name: Check YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Không tìm thấy APK:"
            echo "$APK"
            exit 1
          fi

          ls -lh "$APK"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL "$API" |
            grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Không tìm thấy Morphe CLI"
            exit 1
          fi

          echo "Morphe CLI:"
          echo "$URL"

          wget \
            -q \
            --show-progress \
            "$URL" \
            -O morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

          ls -lh morphe-cli.jar

      - name: Patch YouTube MAIN
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "======================================"
          echo "PATCH MORPHE MAIN"
          echo "VERSION: $VERSION"
          echo "======================================"

          java \
            -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            "$APK"

      - name: Find patched APK
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name "*.apk" \
            -printf '%p %s bytes\n'

      - name: Rename main APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          ORIGINAL="com.google.android.youtube-${VERSION}-all.apk"

          SOURCE="$(
            find . \
              -type f \
              -name "*.apk" |
            grep -v "$ORIGINAL" |
            head -n 1
          )"

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Không tìm thấy patched MAIN APK"
            exit 1
          fi

          OUTPUT="youtube-morphe-${VERSION}.apk"

          cp "$SOURCE" "$OUTPUT"

          ls -lh "$OUTPUT"

      - name: Generate main SHA256
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="youtube-morphe-${VERSION}.apk"

          sha256sum \
            "$APK" \
            > "${APK}.sha256"

          cat "${APK}.sha256"

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-main
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-${{ env.VERSION }}.apk.sha256
          retention-days: 1


  # ==================================================
  # MORPHE DEV
  #
  # DEV = Morphe prerelease
  # KHÔNG PHẢI GITHUB BRANCH DEV
  # ==================================================

  dev:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java
        shell: bash
        run: |
          set -e
          java -version

      - name: Read dev version
        shell: bash
        run: |
          set -e

          if [ ! -f "version_dev.txt" ]; then
            echo "ERROR: Không tìm thấy version_dev.txt"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt rỗng"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "MORPHE DEV"
          echo "VERSION: $VERSION"
          echo "MODE: PRERELEASE"
          echo "======================================"

      - name: Download YouTube from APKMirror
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: Không tìm thấy scripts/download_youtube.js"
            exit 1
          fi

          node scripts/download_youtube.js

      - name: Check YouTube APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Không tìm thấy APK:"
            echo "$APK"
            exit 1
          fi

          ls -lh "$APK"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          URL="$(
            curl -fsSL "$API" |
            grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Không tìm thấy Morphe CLI"
            exit 1
          fi

          echo "Morphe CLI:"
          echo "$URL"

          wget \
            -q \
            --show-progress \
            "$URL" \
            -O morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

          ls -lh morphe-cli.jar

      - name: Patch YouTube MORPHE DEV
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="com.google.android.youtube-${VERSION}-all.apk"

          echo "======================================"
          echo "PATCH MORPHE DEV"
          echo "VERSION: $VERSION"
          echo "MODE: PRERELEASE"
          echo "======================================"

          java \
            -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            "$APK"

      - name: Find patched APK
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name "*.apk" \
            -printf '%p %s bytes\n'

      - name: Rename dev APK
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          ORIGINAL="com.google.android.youtube-${VERSION}-all.apk"

          SOURCE="$(
            find . \
              -type f \
              -name "*.apk" |
            grep -v "$ORIGINAL" |
            head -n 1
          )"

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Không tìm thấy patched DEV APK"
            exit 1
          fi

          OUTPUT="youtube-morphe-dev-${VERSION}.apk"

          cp "$SOURCE" "$OUTPUT"

          ls -lh "$OUTPUT"

      - name: Generate dev SHA256
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e

          APK="youtube-morphe-dev-${VERSION}.apk"

          sha256sum \
            "$APK" \
            > "${APK}.sha256"

          cat "${APK}.sha256"

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-${{ env.VERSION }}.apk.sha256
          retention-days: 1


  # ==================================================
  # COMMON RELEASE
  #
  # MAIN + DEV chạy song song
  # RELEASE chờ cả 2
  # ==================================================

  release:
    needs:
      - main
      - dev

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      #
      # Cần .git để GitHub CLI thao tác release
      # ================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ================================================
      # DOWNLOAD MAIN ARTIFACT
      # ================================================

      - name: Download main artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-main
          path: release

      # ================================================
      # DOWNLOAD DEV ARTIFACT
      # ================================================

      - name: Download dev artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      # ================================================
      # LIST FILES
      # ================================================

      - name: List release files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n'

      # ================================================
      # GET VERSIONS
      # ================================================

      - name: Get versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -type f \
              -name 'youtube-morphe-*.apk' |
            grep -v 'youtube-morphe-dev-' |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -type f \
              -name 'youtube-morphe-dev-*.apk' |
            head -n 1
          )"

          if [ -z "$MAIN_APK" ]; then
            echo "ERROR: Main APK missing"
            exit 1
          fi

          if [ -z "$DEV_APK" ]; then
            echo "ERROR: Dev APK missing"
            exit 1
          fi

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed 's/^youtube-morphe-//' |
            sed 's/\.apk$//'
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed 's/^youtube-morphe-dev-//' |
            sed 's/\.apk$//'
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

          echo "MAIN VERSION: $MAIN_VERSION"
          echo "DEV VERSION: $DEV_VERSION"

      # ================================================
      # CHECK GH CLI
      # ================================================

      - name: Check GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh --version

          gh repo view \
            --json nameWithOwner \
            -q '.nameWithOwner'

      # ================================================
      # CREATE OR UPDATE RELEASE
      #
      # KHÔNG XÓA RELEASE CŨ
      # ================================================

      - name: Create or update combined release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          echo "======================================"
          echo "CREATE / UPDATE RELEASE"
          echo "TAG: $TAG"
          echo "MAIN: $MAIN_VERSION"
          echo "DEV:  $DEV_VERSION"
          echo "======================================"

          # ============================================
          # CREATE IF NOT EXISTS
          # ============================================

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists."
            echo "Keeping existing release."

          else

            echo "Release does not exist."
            echo "Creating release..."

            gh release create \
              "$TAG" \
              --title \
              "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes \
                  "## YouTube Morphe
                  
                  ### MAIN
                  
                  Version: ${MAIN_VERSION}
                  
                  Patch:
                  MorpheApp/morphe-patches main
                  
                  ### DEV
                  
                  Version: ${DEV_VERSION}
                  
                  Patch:
                  MorpheApp/morphe-patches prerelease/dev
                  
                  MAIN and DEV are patched in parallel.
                  
                  Scheduled:
                  23:00 Vietnam time."

          fi

          # ============================================
          # UPDATE TITLE / NOTES
          # ============================================

          gh release edit "$TAG" \
            --title \
            "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
            --notes \
              "## YouTube Morphe
              
              ### MAIN
              
              Version: ${MAIN_VERSION}
              
              Patch:
              MorpheApp/morphe-patches main
              
              ### DEV
              
              Version: ${DEV_VERSION}
              
              Patch:
              MorpheApp/morphe-patches prerelease/dev
              
              MAIN and DEV are patched in parallel.
              
              Scheduled:
              23:00 Vietnam time."

          # ============================================
          # UPLOAD ASSETS
          #
          # --clobber:
          # cùng tên -> thay file
          # tên khác -> giữ file cũ
          # ============================================

          echo "Uploading APK files..."

          gh release upload \
            "$TAG" \
            release/*.apk \
            release/*.sha256 \
            --clobber

          # ============================================
          # SHOW RELEASE
          # ============================================

          echo "======================================"
          echo "RELEASE UPDATED SUCCESSFULLY"
          echo "======================================"

          gh release view "$TAG"
