name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

env:
  MORPHE_PATCHES: https://github.com/MorpheApp/morphe-patches

jobs:

  stable:
    name: Stable
    runs-on: ubuntu-latest

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl

      - name: Read stable version
        shell: bash
        run: |
          set -e

          test -f version.txt

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          test -n "$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Stable version: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube APK
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "YouTube APK: $INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Build Non Root
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      - name: Build Root
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            stable

      - name: Commit encrypted keystore
        shell: bash
        run: |
          set -e

          if [ ! -f keys/keystore.enc ]; then
            echo "ERROR: keys/keystore.enc was not created"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc is already committed"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  dev:
    name: Dev
    runs-on: ubuntu-latest

    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            p7zip-full \
            zipalign \
            apksigner \
            openssl

      - name: Read dev version
        shell: bash
        run: |
          set -e

          test -f version_dev.txt

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          test -n "$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Dev version: $VERSION"

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube APK
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . \
              -type f \
              -name "*.apk" \
              ! -path "./.git/*" |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "YouTube APK: $INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Build Non Root
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_nonroot.sh

          scripts/build_nonroot.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      - name: Build Root
        shell: bash
        run: |
          set -e

          chmod +x scripts/build_root.sh

          scripts/build_root.sh \
            "$VERSION" \
            "$INPUT" \
            dev

      - name: Commit encrypted keystore
        shell: bash
        run: |
          set -e

          if [ ! -f keys/keystore.enc ]; then
            echo "ERROR: keys/keystore.enc was not created"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keys/keystore.enc

          if git diff --cached --quiet; then
            echo "keystore.enc is already committed"
          else
            git commit -m "Update encrypted YouTube keystore"
            git push
          fi

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube_dev_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1


  release:
    name: Common Release

    needs:
      - stable
      - dev

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Read versions
        shell: bash
        run: |
          set -e

          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                NON ROOT
                - Morphe patches main
                - Custom branding disabled
                - GmsCore support enabled
                
                ROOT
                - Morphe patches main
                - --mount enabled
                - GmsCore support disabled
                - Custom branding disabled
                - Stock APK included
                - bin included when available
                
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}"

          find release \
            -type f \
            \( -name "*.apk" -o -name "*.zip" \) \
            -print0 |
          xargs -0 -r gh release upload "$TAG" --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
