name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:

  main:
    name: Morphe Stable
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read version
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Stable version: $VERSION"

      - name: Check downloader
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: scripts/download_youtube.js not found"
            ls -la scripts 2>/dev/null || true
            exit 1
          fi

          node --version

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Selected: $INPUT"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Stable
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-${VERSION}.apk"

      - name: Create Stable Root Module
        shell: bash
        run: |
          set -e

          rm -rf root-module

          mkdir -p \
            root-module/stock \
            root-module/patched \
            root-module/system

          cp "$INPUT" root-module/stock/YouTube.apk

          cp \
            "youtube-morphe-${VERSION}.apk" \
            root-module/patched/YouTube.apk

          cat > root-module/module.prop <<EOF
          id=youtube_morphe
          name=YouTube Morphe Root
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe Magisk module
          EOF

          cat > root-module/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Root"
          ui_print "======================================"
          ui_print "Stock APK included"
          ui_print "Patched APK included"
          ui_print "GmsCore support: Disabled"
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          STOCK="$MODDIR/stock/YouTube.apk"
          PATCHED="$MODDIR/patched/YouTube.apk"

          PKG="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe.log"

          exec >>"$LOG" 2>&1

          echo "======================================"
          echo "YouTube Morphe Root"
          echo "======================================"

          if [ ! -f "$STOCK" ]; then
              echo "ERROR: Stock APK missing"
              exit 1
          fi

          if [ ! -f "$PATCHED" ]; then
              echo "ERROR: Patched APK missing"
              exit 1
          fi

          echo "Stock APK: $STOCK"
          echo "Patched APK: $PATCHED"

          echo "Waiting for Android..."

          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done

          sleep 5

          echo "Stopping YouTube..."

          am force-stop "$PKG" || true

          sleep 3

          echo "======================================"
          echo "STEP 1: RESTORE STOCK"
          echo "======================================"

          pm path "$PKG" || true

          pm install -r \
              --user 0 \
              "$STOCK"

          INSTALL_RESULT=$?

          echo "Stock install result: $INSTALL_RESULT"

          if [ "$INSTALL_RESULT" -ne 0 ]; then
              echo "Normal stock install failed"

              pm install -r \
                  --user 0 \
                  --force-sdk \
                  "$STOCK"

              INSTALL_RESULT=$?

              echo "Second stock install result: $INSTALL_RESULT"
          fi

          if [ "$INSTALL_RESULT" -ne 0 ]; then
              echo "ERROR: Cannot install stock YouTube"
              pm path "$PKG" || true
              exit 1
          fi

          echo "Stock YouTube installed"

          am force-stop "$PKG" || true

          sleep 5

          echo "======================================"
          echo "VERIFY STOCK"
          echo "======================================"

          STOCK_PATHS="$(
              pm path "$PKG" 2>/dev/null |
              sed 's/^package://'
          )"

          if [ -z "$STOCK_PATHS" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          echo "$STOCK_PATHS"

          TARGET=""

          while IFS= read -r APK_PATH; do

              [ -z "$APK_PATH" ] && continue

              case "$APK_PATH" in

                  */base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  *.apk)
                      if [ -z "$TARGET" ]; then
                          TARGET="$APK_PATH"
                      fi
                      ;;

              esac

          done <<EOF_PATHS
          $STOCK_PATHS
          EOF_PATHS

          if [ -z "$TARGET" ]; then
              echo "ERROR: Cannot determine YouTube APK path"
              exit 1
          fi

          echo "Detected YouTube APK:"
          echo "$TARGET"

          if [ ! -e "$TARGET" ]; then
              echo "ERROR: Target does not exist"
              exit 1
          fi

          echo "======================================"
          echo "STOCK VERIFIED"
          echo "======================================"

          sleep 3

          echo "======================================"
          echo "STEP 2: MOUNT PATCHED"
          echo "======================================"

          am force-stop "$PKG" || true

          sleep 2

          mount --bind \
              "$PATCHED" \
              "$TARGET"

          MOUNT_RESULT=$?

          echo "Mount result: $MOUNT_RESULT"

          if [ "$MOUNT_RESULT" -ne 0 ]; then
              echo "ERROR: Failed to mount patched APK"
              exit 1
          fi

          echo "Patched APK mounted successfully"

          echo "======================================"
          echo "VERIFY PATCH"
          echo "======================================"

          mount | grep "$TARGET" || true

          echo "Starting YouTube..."

          monkey \
              -p "$PKG" \
              1 >/dev/null 2>&1 || true

          echo "======================================"
          echo "SUCCESS"
          echo "======================================"
          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          zip -r \
            "../youtube-morphe-root-${VERSION}.zip" \
            module.prop \
            customize.sh \
            service.sh \
            stock \
            patched \
            system

          cd ..

          test -f "youtube-morphe-root-${VERSION}.zip"

          unzip -l \
            "youtube-morphe-root-${VERSION}.zip"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube-morphe-root-${{ env.VERSION }}.zip
          retention-days: 1


  dev:
    name: Morphe Dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read dev version
        shell: bash
        run: |
          set -e

          if [ ! -f "version_dev.txt" ]; then
            echo "ERROR: version_dev.txt not found"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Dev version: $VERSION"

      - name: Check downloader
        shell: bash
        run: |
          set -e

          test -f scripts/download_youtube.js

          node --version

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

      - name: Download Morphe
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o \
              'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          test -s morphe-cli.jar

      - name: Patch Dev
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "GmsCore support" \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

          test -f "youtube-morphe-dev-${VERSION}.apk"

      - name: Create Dev Root Module
        shell: bash
        run: |
          set -e

          rm -rf root-module

          mkdir -p \
            root-module/stock \
            root-module/patched \
            root-module/system

          cp "$INPUT" root-module/stock/YouTube.apk

          cp \
            "youtube-morphe-dev-${VERSION}.apk" \
            root-module/patched/YouTube.apk

          cat > root-module/module.prop <<EOF
          id=youtube_morphe_dev
          name=YouTube Morphe Dev Root
          version=${VERSION}
          versionCode=${VERSION}
          author=Chuong
          description=YouTube Morphe Dev Magisk module
          EOF

          cat > root-module/customize.sh <<'EOF'
          #!/system/bin/sh

          ui_print "======================================"
          ui_print " YouTube Morphe Dev Root"
          ui_print "======================================"
          ui_print "Stock APK included"
          ui_print "Patched APK included"
          ui_print "GmsCore support: Disabled"
          ui_print "Custom branding: Disabled"
          ui_print "======================================"
          EOF

          cat > root-module/service.sh <<'EOF'
          #!/system/bin/sh

          MODDIR="${0%/*}"

          STOCK="$MODDIR/stock/YouTube.apk"
          PATCHED="$MODDIR/patched/YouTube.apk"

          PKG="com.google.android.youtube"

          LOG="/data/adb/youtube_morphe_dev.log"

          exec >>"$LOG" 2>&1

          echo "======================================"
          echo "YouTube Morphe Dev Root"
          echo "======================================"

          if [ ! -f "$STOCK" ]; then
              echo "ERROR: Stock APK missing"
              exit 1
          fi

          if [ ! -f "$PATCHED" ]; then
              echo "ERROR: Patched APK missing"
              exit 1
          fi

          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done

          sleep 5

          echo "STEP 1: RESTORE STOCK"

          am force-stop "$PKG" || true

          sleep 3

          pm install -r \
              --user 0 \
              "$STOCK"

          INSTALL_RESULT=$?

          if [ "$INSTALL_RESULT" -ne 0 ]; then

              pm install -r \
                  --user 0 \
                  --force-sdk \
                  "$STOCK"

              INSTALL_RESULT=$?

          fi

          if [ "$INSTALL_RESULT" -ne 0 ]; then
              echo "ERROR: Cannot install stock YouTube"
              exit 1
          fi

          echo "Stock installed"

          am force-stop "$PKG" || true

          sleep 5

          STOCK_PATHS="$(
              pm path "$PKG" 2>/dev/null |
              sed 's/^package://'
          )"

          if [ -z "$STOCK_PATHS" ]; then
              echo "ERROR: YouTube package not found"
              exit 1
          fi

          TARGET=""

          while IFS= read -r APK_PATH; do

              [ -z "$APK_PATH" ] && continue

              case "$APK_PATH" in

                  */base.apk)
                      TARGET="$APK_PATH"
                      break
                      ;;

                  *.apk)
                      if [ -z "$TARGET" ]; then
                          TARGET="$APK_PATH"
                      fi
                      ;;

              esac

          done <<EOF_PATHS
          $STOCK_PATHS
          EOF_PATHS

          if [ -z "$TARGET" ]; then
              echo "ERROR: Cannot determine YouTube APK path"
              exit 1
          fi

          echo "Target: $TARGET"

          echo "STEP 2: MOUNT PATCHED"

          am force-stop "$PKG" || true

          sleep 2

          mount --bind \
              "$PATCHED" \
              "$TARGET"

          if [ $? -ne 0 ]; then
              echo "ERROR: Mount failed"
              exit 1
          fi

          echo "Patched mounted"

          mount | grep "$TARGET" || true

          monkey \
              -p "$PKG" \
              1 >/dev/null 2>&1 || true

          echo "SUCCESS"

          EOF

          chmod 755 root-module/customize.sh
          chmod 755 root-module/service.sh

          cd root-module

          zip -r \
            "../youtube-morphe-dev-root-${VERSION}.zip" \
            module.prop \
            customize.sh \
            service.sh \
            stock \
            patched \
            system

          cd ..

          test -f "youtube-morphe-dev-root-${VERSION}.zip"

          unzip -l \
            "youtube-morphe-dev-root-${VERSION}.zip"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube-morphe-dev-root-${{ env.VERSION }}.zip
          retention-days: 1


  release:
    name: Common Release
    needs:
      - main
      - dev
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: List Release Files
        shell: bash
        run: |
          set -e

          find release \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n"

      - name: Get Versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-*.apk" \
              ! -name "youtube-morphe-dev-*" |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-dev-*.apk" |
            head -n 1
          )"

          test -n "$MAIN_APK"
          test -n "$DEV_APK"

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed "s/^youtube-morphe-//" |
            sed "s/\.apk$//"
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed "s/^youtube-morphe-dev-//" |
            sed "s/\.apk$//"
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                Disabled patches:
                - GmsCore support
                - Custom branding
                
                Root modules:
                - Stock APK included
                - Patched APK included
                - Stock restored first
                - Patched APK mounted after
                - YouTube path detected automatically"
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
            --notes "YouTube Morphe

                Stable: ${MAIN_VERSION}
                Dev: ${DEV_VERSION}
                
                Disabled patches:
                - GmsCore support
                - Custom branding
                
                Root modules:
                - Stock APK included
                - Patched APK included
                - Stock restored first
                - Patched APK mounted after
                - YouTube path detected automatically"

          gh release upload \
            "$TAG" \
            release/*.apk \
            release/*.zip \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
