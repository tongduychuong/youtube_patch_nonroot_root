name: YouTube Morphe Patch chung

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Stable + Dev"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  MICROG_URL: https://github.com/MorpheApp/MicroG-RE/releases

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zipalign apksigner openssl jq

      - name: Prepare & Build Versions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Đọc version chuẩn từ file và kiểm tra kỹ
          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"
          
          if [ -z "$MAIN_VERSION" ]; then
            echo "Error: version.txt is empty!"
            exit 1
          fi
          if [ -z "$DEV_VERSION" ]; then
            echo "Error: version_dev.txt is empty!"
            exit 1
          fi

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

          # Lấy tag Morphe Stable
          TAG_STABLE="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
            jq -r '.tag_name')"
          test -n "$TAG_STABLE" && test "$TAG_STABLE" != null

          # Lấy tag Morphe Dev
          TAG_DEV="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true) | .tag_name][0]')"
          test -n "$TAG_DEV" && test "$TAG_DEV" != null

          # Kiểm tra điều kiện Build Stable
          BUILD_STABLE=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/releases" --paginate > releases.json 2>/dev/null || true
            if jq -r '.[].body // ""' releases.json 2>/dev/null | grep -Fq "${TAG_STABLE}"; then
              BUILD_STABLE=false
            fi
          fi
          echo "build_stable=$BUILD_STABLE" >> "$GITHUB_OUTPUT"

          # Kiểm tra điều kiện Build Dev
          BUILD_DEV=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            if jq -r '.[].body // ""' releases.json 2>/dev/null | grep -Fq "${TAG_DEV}"; then
              BUILD_DEV=false
            fi
          fi
          echo "build_dev=$BUILD_DEV" >> "$GITHUB_OUTPUT"

          # Tải chung morphe-cli.jar một lần
          URL="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" |
            jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' |
            head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fsSL --retry 5 -H "User-Agent: GitHubActions" "$URL" -o morphe-cli.jar
          test -s morphe-cli.jar

          chmod +x scripts/build_nonroot.sh scripts/build_root.sh

          # --- BUILD STABLE ---
          if [ "$BUILD_STABLE" = "true" ]; then
            echo "Building Stable with version: $MAIN_VERSION"
            node scripts/download_youtube.js "$MAIN_VERSION"
            INPUT_STABLE="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
            test -n "$INPUT_STABLE"
            scripts/build_nonroot.sh "$MAIN_VERSION" "$INPUT_STABLE" stable
            scripts/build_root.sh "$MAIN_VERSION" "$INPUT_STABLE" stable
          fi

          # --- BUILD DEV ---
          if [ "$BUILD_DEV" = "true" ]; then
            echo "Building Dev with version: $DEV_VERSION"
            node scripts/download_youtube.js "$DEV_VERSION"
            INPUT_DEV="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
            test -n "$INPUT_DEV"
            scripts/build_nonroot.sh "$DEV_VERSION" "$INPUT_DEV" dev
            scripts/build_root.sh "$DEV_VERSION" "$INPUT_DEV" dev
          fi

          # Cập nhật keystore (nếu có thay đổi)
          if [ -f keys/keystore.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keys/keystore.enc
            git diff --cached --quiet || (git pull --rebase origin main && git commit -m "Update encrypted YouTube keystore" && git push)
          fi

          # Lưu lại tag Morphe để dùng cho bước release
          echo "MORPHE_MAIN=$TAG_STABLE" >> "$GITHUB_ENV"
          echo "MORPHE_DEV=$TAG_DEV" >> "$GITHUB_ENV"

      - name: Create Release
        if: steps.prepare.outputs.build_stable == 'true' || steps.prepare.outputs.build_dev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          MAIN_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_MAIN}"
          DEV_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_DEV}"

          RUN_TAG="v${MAIN_VERSION}-${GITHUB_RUN_ID}"
          RUN_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NAME="YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION} - ${RUN_TIME}"

          printf "## YouTube\n\n" > release_notes.txt
          printf -- "- Stable: %s\n" "$MAIN_VERSION" >> release_notes.txt
          printf -- "- Dev: %s\n\n" "$DEV_VERSION" >> release_notes.txt
          printf "## Morphe Patch\n\n" >> release_notes.txt
          printf -- "- Stable: [%s](%s)\n" "$MORPHE_MAIN" "$MAIN_URL" >> release_notes.txt
          printf -- "- Dev: [%s](%s)\n\n" "$MORPHE_DEV" "$DEV_URL" >> release_notes.txt
          printf "## MicroG\n\n" >> release_notes.txt
          printf "MicroG is required for **YouTube Non-root**.\n\n" >> release_notes.txt
          printf "[Download MicroG from MorpheApp/MicroG-RE](%s)\n" "$MICROG_URL" >> release_notes.txt

          # Gom tất cả file apk và zip vừa build xong vào thư mục release
          mkdir -p release
          find . -maxdepth 1 \( -name "*.apk" -o -name "*.zip" \) -exec cp {} release/ \;

          FILES=$(find release -type f \( -name "*.apk" -o -name "*.zip" \))

          gh release create "$RUN_TAG" \
            --title "$NAME" \
            --notes-file release_notes.txt \
            $FILES

  cleanup:
    name: Cleanup
    needs: [build_and_release]
    if: always() && needs.build_and_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup old releases and tags
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}")

          curl -fsSL "${AUTH[@]}" "$API/releases?per_page=100" |
            jq -r 'sort_by(.published_at // .created_at) | reverse | .[3:][] | "\(.id)|\(.tag_name)"' |
            while IFS='|' read -r id tag; do
              [ -z "$id" ] && continue
              curl -fsSL -X DELETE "${AUTH[@]}" "$API/releases/$id"
              curl -s -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$tag" >/dev/null || true
            done

      - name: Delete excess workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching workflow runs..."
          run_ids=$(gh run list --limit 100 --json databaseId -q '.[5:][].databaseId')
          
          for id in $run_ids; do
            echo "Deleting run ID: $id"
            gh run delete "$id" || true
          done
          echo "Cleanup completed!"
