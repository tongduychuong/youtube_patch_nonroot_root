name: YouTube Morphe Patch

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  main:
    name: Morphe Stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read version
        shell: bash
        run: |
          set -e

          if [ ! -f "version.txt" ]; then
            echo "ERROR: version.txt not found"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "MAIN VERSION: $VERSION"

      - name: Check download script
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: scripts/download_youtube.js not found"
            ls -la scripts 2>/dev/null || true
            exit 1
          fi

          echo "Node:"
          node --version

          echo "Downloader:"
          ls -lh scripts/download_youtube.js

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOAD YOUTUBE"
          echo "VERSION: $VERSION"
          echo "======================================"

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCH DOWNLOADED FILE"
          echo "======================================"

          find . -maxdepth 3 -type f \
            \( \
              -name "*.apk" \
              -o -name "*.apkm" \
              -o -name "*.xapk" \
              -o -name "*.apks" \
            \) \
            -printf "%p %s bytes\n"

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Selected:"
          echo "$INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          echo "Getting Morphe CLI..."

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          echo "Morphe URL:"
          echo "$URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

          ls -lh morphe-cli.jar

      - name: Check Morphe CLI
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar --help

      - name: Patch Stable
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PATCH STABLE"
          echo "VERSION: $VERSION"
          echo "INPUT: $INPUT"
          echo "CUSTOM BRANDING: DISABLED"
          echo "======================================"

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --disable "Custom branding" \
            -o "youtube-morphe-${VERSION}.apk" \
            "$INPUT"

      - name: Check Stable APK
        shell: bash
        run: |
          set -e

          APK="youtube-morphe-${VERSION}.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Stable APK not found"
            find . -type f -name "*.apk" -printf "%p %s bytes\n"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Stable
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-stable
          path: "youtube-morphe-${{ env.VERSION }}.apk"
          retention-days: 1

  dev:
    name: Morphe Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read dev version
        shell: bash
        run: |
          set -e

          if [ ! -f "version_dev.txt" ]; then
            echo "ERROR: version_dev.txt not found"
            exit 1
          fi

          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: version_dev.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "DEV VERSION: $VERSION"

      - name: Check download script
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/download_youtube.js" ]; then
            echo "ERROR: scripts/download_youtube.js not found"
            ls -la scripts 2>/dev/null || true
            exit 1
          fi

          node --version

          ls -lh scripts/download_youtube.js

      - name: Download YouTube
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOAD YOUTUBE DEV"
          echo "VERSION: $VERSION"
          echo "======================================"

          node scripts/download_youtube.js "$VERSION"

      - name: Find YouTube
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCH DOWNLOADED FILE"
          echo "======================================"

          find . -maxdepth 3 -type f \
            \( \
              -name "*.apk" \
              -o -name "*.apkm" \
              -o -name "*.xapk" \
              -o -name "*.apks" \
            \) \
            -printf "%p %s bytes\n"

          INPUT="$(
            find . -maxdepth 3 -type f \
              \( \
                -name "*.apk" \
                -o -name "*.apkm" \
                -o -name "*.xapk" \
                -o -name "*.apks" \
              \) |
            head -n 1
          )"

          if [ -z "$INPUT" ]; then
            echo "ERROR: YouTube APK/BUNDLE not found"
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Selected:"
          echo "$INPUT"

      - name: Download Morphe CLI
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest"

          RESPONSE="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: GitHubActions" \
              "$API"
          )"

          URL="$(
            echo "$RESPONSE" |
            grep -o 'https://[^"]*morphe-desktop-[^"]*-all\.jar' |
            head -n 1
          )"

          if [ -z "$URL" ]; then
            echo "ERROR: Morphe CLI not found"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: GitHubActions" \
            "$URL" \
            -o morphe-cli.jar

          if [ ! -s "morphe-cli.jar" ]; then
            echo "ERROR: Morphe CLI download failed"
            exit 1
          fi

      - name: Check Morphe CLI
        shell: bash
        run: |
          set -e

          java -jar morphe-cli.jar --help

      - name: Patch Dev
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PATCH MORPHE DEV"
          echo "VERSION: $VERSION"
          echo "INPUT: $INPUT"
          echo "CUSTOM BRANDING: DISABLED"
          echo "======================================"

          java -jar morphe-cli.jar \
            patch \
            --patches \
            https://github.com/MorpheApp/morphe-patches \
            --prerelease \
            --disable "Custom branding" \
            -o "youtube-morphe-dev-${VERSION}.apk" \
            "$INPUT"

      - name: Check Dev APK
        shell: bash
        run: |
          set -e

          APK="youtube-morphe-dev-${VERSION}.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Dev APK not found"
            find . -type f -name "*.apk" -printf "%p %s bytes\n"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Dev
        uses: actions/upload-artifact@v4
        with:
          name: youtube-morphe-dev
          path: "youtube-morphe-dev-${{ env.VERSION }}.apk"
          retention-days: 1

  release:
    name: Common Release
    needs:
      - main
      - dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Stable
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: List release files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          find release \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n"

      - name: Get versions
        shell: bash
        run: |
          set -e

          MAIN_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-*.apk" \
              ! -name "youtube-morphe-dev-*" |
            head -n 1
          )"

          DEV_APK="$(
            find release \
              -maxdepth 1 \
              -name "youtube-morphe-dev-*.apk" |
            head -n 1
          )"

          if [ -z "$MAIN_APK" ]; then
            echo "ERROR: Stable APK missing"
            exit 1
          fi

          if [ -z "$DEV_APK" ]; then
            echo "ERROR: Dev APK missing"
            exit 1
          fi

          MAIN_VERSION="$(
            basename "$MAIN_APK" |
            sed "s/^youtube-morphe-//" |
            sed "s/\.apk$//"
          )"

          DEV_VERSION="$(
            basename "$DEV_APK" |
            sed "s/^youtube-morphe-dev-//" |
            sed "s/\.apk$//"
          )"

          echo "MAIN_VERSION=$MAIN_VERSION" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

          echo "MAIN VERSION: $MAIN_VERSION"
          echo "DEV VERSION: $DEV_VERSION"

      - name: Create or update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="youtube-morphe"

          echo "======================================"
          echo "RELEASE"
          echo "TAG: $TAG"
          echo "MAIN: $MAIN_VERSION"
          echo "DEV: $DEV_VERSION"
          echo "======================================"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
            echo "Keeping existing release"
          else
            echo "Creating release"

            gh release create "$TAG" \
              --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
              --notes "YouTube Morphe

              Stable: ${MAIN_VERSION}
              Dev: ${DEV_VERSION}
              
              Custom branding: Disabled"
          fi

          gh release edit "$TAG" \
            --title "YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}" \
            --notes "YouTube Morphe

            Stable: ${MAIN_VERSION}
            Dev: ${DEV_VERSION}
            
            Custom branding: Disabled"

          echo "Uploading APK files"

          gh release upload \
            "$TAG" \
            release/*.apk \
            --clobber

          echo "======================================"
          echo "RELEASE SUCCESS"
          echo "======================================"

          gh release view "$TAG"
