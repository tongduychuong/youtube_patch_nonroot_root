name: YouTube Morphe Patch test

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Stable + Dev"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  RELEASE_TAG: youtube-morphe
  MICROG_URL: https://github.com/MorpheApp/MicroG-RE/releases

jobs:
  stable:
    name: Build Stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
      VERSION_FILE: version.txt
      BUILD_FLAG: BUILD_STABLE
      BUILD_TYPE: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zipalign apksigner openssl jq

      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < "$VERSION_FILE" | xargs)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          TAG="$(curl -fsSL --retry 5 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" | jq -r '.tag_name')"
          test -n "$TAG" && test "$TAG" != null
          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          BUILD=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] &&
             gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json 2>/dev/null; then
            if jq -r '.body // ""' release.json | grep -Fq "Morphe Patch ${TAG} Changelog"; then
              BUILD=false
            fi
          fi
          echo "${BUILD_FLAG}=$BUILD" >> "$GITHUB_ENV"

      - name: Build
        if: env.BUILD_STABLE == 'true'
        shell: bash
        run: |
          set -e
          node scripts/download_youtube.js "$VERSION"
          INPUT="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
          test -n "$INPUT"
          curl -fsSL --retry 5 -H "User-Agent: GitHubActions" \
            "$(curl -fsSL --retry 5 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" |
            jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)" \
            -o morphe-cli.jar
          test -s morphe-cli.jar
          chmod +x scripts/build_nonroot.sh scripts/build_root.sh
          scripts/build_nonroot.sh "$VERSION" "$INPUT" "$BUILD_TYPE"
          scripts/build_root.sh "$VERSION" "$INPUT" "$BUILD_TYPE"
          test -f keys/keystore.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys/keystore.enc
          git diff --cached --quiet || (git commit -m "Update encrypted YouTube keystore" && git push)

      - uses: actions/upload-artifact@v4
        if: env.BUILD_STABLE == 'true'
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1

  dev:
    name: Build Dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
      VERSION_FILE: version_dev.txt
      BUILD_FLAG: BUILD_DEV
      BUILD_TYPE: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zipalign apksigner openssl jq

      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < "$VERSION_FILE" | xargs)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          TAG="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true) | .tag_name][0]')"
          test -n "$TAG" && test "$TAG" != null
          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          BUILD=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] &&
             gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json 2>/dev/null; then
            if jq -r '.body // ""' release.json | grep -Fq "Morphe Patch ${TAG} Changelog"; then
              BUILD=false
            fi
          fi
          echo "${BUILD_FLAG}=$BUILD" >> "$GITHUB_ENV"

      - name: Build
        if: env.BUILD_DEV == 'true'
        shell: bash
        run: |
          set -e
          node scripts/download_youtube.js "$VERSION"
          INPUT="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
          test -n "$INPUT"
          curl -fsSL --retry 5 -H "User-Agent: GitHubActions" \
            "$(curl -fsSL --retry 5 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" |
            jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)" \
            -o morphe-cli.jar
          test -s morphe-cli.jar
          chmod +x scripts/build_nonroot.sh scripts/build_root.sh
          scripts/build_nonroot.sh "$VERSION" "$INPUT" "$BUILD_TYPE"
          scripts/build_root.sh "$VERSION" "$INPUT" "$BUILD_TYPE"
          test -f keys/keystore.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys/keystore.enc
          git diff --cached --quiet || (git commit -m "Update encrypted YouTube keystore" && git push)

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEV == 'true'
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube_dev_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [stable, dev]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        if: needs.stable.result == 'success' || needs.dev.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: youtube-morphe-*
          path: release
          merge-multiple: true

      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"
          MAIN_MORPHE="$(curl -fsSL "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" | jq -r '.tag_name')"
          DEV_MORPHE="$(curl -fsSL "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true) | .tag_name][0]')"
          MAIN_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MAIN_MORPHE}"
          DEV_URL="https://github.com/${MORPHE_REPO}/releases/tag/${DEV_MORPHE}"

          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json 2>/dev/null; then
            jq -r '.body // ""' release.json > release_notes.txt
          else
            : > release_notes.txt
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("release_notes.txt")
          t = p.read_text() if p.exists() else ""
          t = re.sub(r'(?ms)^## Morphe Patch.*?(?=^## |\Z)', '', t)
          t = re.sub(r'(?ms)^## MicroG.*?(?=^## |\Z)', '', t)
          p.write_text(t.strip() + "\n")
          PY

          cat >> release_notes.txt <<EOF

          ## Morphe Patch

          ### Stable
          **${MAIN_MORPHE}**
          [Morphe Patch ${MAIN_MORPHE} Changelog](${MAIN_URL})

          ### Dev
          **${DEV_MORPHE}**
          [Morphe Patch ${DEV_MORPHE} Changelog](${DEV_URL})

          ## MicroG
          MicroG is required for **YouTube Non-root**.
          [Download MicroG from MorpheApp/MicroG-RE](${MICROG_URL})

          ## YouTube
          - Stable: ${MAIN_VERSION}
          - Dev: ${DEV_VERSION}

          ## Build
          - Stable Non-root
          - Stable Root Magisk
          - Dev Non-root
          - Dev Root Magisk
          EOF

          NOTES_JSON="$(jq -Rs . < release_notes.txt)"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          CODE="$(curl -s -o release.json -w '%{http_code}' -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" "$API/tags/${RELEASE_TAG}")"

          NAME="YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION}"
          if [ "$CODE" = 200 ]; then
            ID="$(jq -r '.id' release.json)"
            curl -fsSL -X PATCH -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/json" \
              "$API/$ID" -d "{\"name\":\"$NAME\",\"body\":$NOTES_JSON}"
          elif [ "$CODE" = 404 ]; then
            curl -fsSL -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/json" \
              "$API" -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"$NAME\",\"body\":$NOTES_JSON,\"draft\":false,\"prerelease\":false}"
          else
            cat release.json
            exit 1
          fi

      - name: Upload APK / ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f \( -name '*.apk' -o -name '*.zip' \) -print0 |
          while IFS= read -r -d '' f; do gh release upload "$RELEASE_TAG" "$f" --clobber; done

  cleanup:
    name: Cleanup
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Cleanup releases, tags and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          H=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}")

          curl -fsSL "${H[@]}" "$API/releases?per_page=100" |
            jq -r 'sort_by(.published_at // .created_at) | reverse | .[3:][] | "\(.id)|\(.tag_name)"' |
          while IFS='|' read -r id tag; do
            curl -fsSL -X DELETE "${H[@]}" "$API/releases/$id"
            curl -s -X DELETE "${H[@]}" "$API/git/refs/tags/$tag" >/dev/null || true
          done

          WF="$(curl -fsSL "${H[@]}" "$API/actions/workflows?per_page=100" |
            jq -r '.workflows[] | select(.path == ".github/workflows/patch.yml") | .id' | head -n1)"
          test -n "$WF" && test "$WF" != null

          curl -fsSL "${H[@]}" "$API/actions/workflows/$WF/runs?per_page=100" |
            jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[3:][] | .id' |
          while read -r id; do
            [ -z "$id" ] || curl -s -X DELETE "${H[@]}" "$API/actions/runs/$id" >/dev/null
          done
