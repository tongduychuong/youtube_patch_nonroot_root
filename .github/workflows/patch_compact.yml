name: YouTube Morphe Patch

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build Stable + Dev"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

env:
  MORPHE_REPO: MorpheApp/morphe-patches
  MICROG_URL: https://github.com/MorpheApp/MicroG-RE/releases

jobs:
  stable:
    name: Build Stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zipalign apksigner openssl jq

      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          TAG="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
            jq -r '.tag_name')"
          test -n "$TAG" && test "$TAG" != null
          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          BUILD=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/releases" --paginate > releases.json 2>/dev/null || true
            if jq -r '.[].body // ""' releases.json 2>/dev/null |
              grep -Fq "Morphe Patch ${TAG} Changelog"; then
              BUILD=false
            fi
          fi
          echo "BUILD_STABLE=$BUILD" >> "$GITHUB_ENV"

      - name: Build Stable
        if: env.BUILD_STABLE == 'true'
        run: |
          set -e
          node scripts/download_youtube.js "$VERSION"
          INPUT="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
          test -n "$INPUT"

          URL="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" |
            jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' |
            head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fsSL --retry 5 -H "User-Agent: GitHubActions" "$URL" -o morphe-cli.jar
          test -s morphe-cli.jar

          chmod +x scripts/build_nonroot.sh scripts/build_root.sh
          scripts/build_nonroot.sh "$VERSION" "$INPUT" stable
          scripts/build_root.sh "$VERSION" "$INPUT" stable

          test -f keys/keystore.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys/keystore.enc
          git diff --cached --quiet || (git pull --rebase origin main && git commit -m "Update encrypted YouTube keystore (Stable)" && git push)

      - uses: actions/upload-artifact@v4
        if: env.BUILD_STABLE == 'true'
        with:
          name: youtube-morphe-stable
          path: |
            youtube-morphe-${{ env.VERSION }}.apk
            youtube_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1

  dev:
    name: Build Dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_ENCRYPTION_KEY: ${{ secrets.KEYSTORE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zipalign apksigner openssl jq

      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          TAG="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true) | .tag_name][0]')"
          test -n "$TAG" && test "$TAG" != null
          echo "MORPHE_VERSION=$TAG" >> "$GITHUB_ENV"

          BUILD=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/releases" --paginate > releases.json 2>/dev/null || true
            if jq -r '.[].body // ""' releases.json 2>/dev/null |
              grep -Fq "Morphe Patch ${TAG} Changelog"; then
              BUILD=false
            fi
          fi
          echo "BUILD_DEV=$BUILD" >> "$GITHUB_ENV"

      - name: Build Dev
        if: env.BUILD_DEV == 'true'
        run: |
          set -e
          node scripts/download_youtube.js "$VERSION"
          INPUT="$(find . -type f -name '*.apk' ! -path './.git/*' | head -n 1)"
          test -n "$INPUT"

          URL="$(curl -fsSL --retry 5 \
            "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest" |
            jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' |
            head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fsSL --retry 5 -H "User-Agent: GitHubActions" "$URL" -o morphe-cli.jar
          test -s morphe-cli.jar

          chmod +x scripts/build_nonroot.sh scripts/build_root.sh
          scripts/build_nonroot.sh "$VERSION" "$INPUT" dev
          scripts/build_root.sh "$VERSION" "$INPUT" dev

          test -f keys/keystore.enc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys/keystore.enc
          git diff --cached --quiet || (git pull --rebase origin main && git commit -m "Update encrypted YouTube keystore (Dev)" && git push)

      - uses: actions/upload-artifact@v4
        if: env.BUILD_DEV == 'true'
        with:
          name: youtube-morphe-dev
          path: |
            youtube-morphe-dev-${{ env.VERSION }}.apk
            youtube_dev_root_mount_${{ env.VERSION }}_Magisk.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [stable, dev]
    if: always() && (needs.stable.result == 'success' || needs.dev.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Stable
        if: needs.stable.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-stable
          path: release

      - name: Download Dev
        if: needs.dev.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: youtube-morphe-dev
          path: release

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          MAIN_VERSION="$(tr -d '\r\n' < version.txt | xargs)"
          DEV_VERSION="$(tr -d '\r\n' < version_dev.txt | xargs)"

          MORPHE_MAIN="$(curl -fsSL \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
            jq -r '.tag_name')"

          MORPHE_DEV="$(curl -fsSL \
            "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '[.[] | select(.prerelease == true) | .tag_name][0]')"

          MAIN_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_MAIN}"
          DEV_URL="https://github.com/${MORPHE_REPO}/releases/tag/${MORPHE_DEV}"

          RUN_TAG="v${MAIN_VERSION}-${GITHUB_RUN_ID}"
          RUN_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NAME="YouTube Morphe ${MAIN_VERSION} / DEV ${DEV_VERSION} - ${RUN_TIME}"

          printf "## YouTube\n\n" > release_notes.txt
          printf -- "- Stable: %s\n" "$MAIN_VERSION" >> release_notes.txt
          printf -- "- Dev: %s\n\n" "$DEV_VERSION" >> release_notes.txt
          printf "## Morphe Patch\n\n" >> release_notes.txt
          printf -- "- Stable: [%s](%s)\n" "$MORPHE_MAIN" "$MAIN_URL" >> release_notes.txt
          printf -- "- Dev: [%s](%s)\n\n" "$MORPHE_DEV" "$DEV_URL" >> release_notes.txt
          printf "## MicroG\n\n" >> release_notes.txt
          printf "MicroG is required for **YouTube Non-root**.\n\n" >> release_notes.txt
          printf "[Download MicroG from MorpheApp/MicroG-RE](%s)\n" "$MICROG_URL" >> release_notes.txt

          FILES=$(find release -type f \( -name "*.apk" -o -name "*.zip" \))

          gh release create "$RUN_TAG" \
            --title "$NAME" \
            --notes-file release_notes.txt \
            $FILES

  cleanup:
    name: Cleanup
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup old releases and tags
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT || github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}")

          curl -fsSL "${AUTH[@]}" "$API/releases?per_page=100" |
            jq -r 'sort_by(.published_at // .created_at) | reverse | .[3:][] | "\(.id)|\(.tag_name)"' |
            while IFS='|' read -r id tag; do
              [ -z "$id" ] && continue
              curl -fsSL -X DELETE "${AUTH[@]}" "$API/releases/$id"
              curl -s -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$tag" >/dev/null || true
            done

      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_PAT }}
        run: |
          set -e
          if [ -z "${{ secrets.CUSTOM_PAT }}" ]; then
            echo "Chưa cấu hình secret CUSTOM_PAT. Bỏ qua bước xoá workflow runs."
            exit 0
          fi

          RUNS_TO_DELETE=$(gh run list \
            --workflow "patch.yml" \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][].databaseId' 2>/dev/null || true)

          for id in $RUNS_TO_DELETE; do
            [ -z "$id" ] && continue
            echo "Deleting workflow run ID: $id"
            gh run delete "$id" || true
          done
