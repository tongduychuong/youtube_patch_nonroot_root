name: "Delete Old Workflow Runs"

on:
  schedule:
    # Chạy định kỳ mỗi ngày vào lúc 0 giờ UTC (hoặc tùy chỉnh theo ý bạn)
    - cron: "0 0 * * *"
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs
        uses: majorleaguecoding/delete-workflow-runs@v2 # Hoặc dùng Action tương tự bên dưới
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 5
